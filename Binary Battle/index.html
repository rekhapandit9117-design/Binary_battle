<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binary Battle | Loading...</title>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">

    <style>

        :root {
            --bg-dark: #05010a;
            --primary: #8c00ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;

            background-image:
                radial-gradient(
                    circle at 50% 50%,
                    rgba(140, 0, 255, 0.15) 0%,
                    transparent 60%
                );
        }

        .logo-container {

            text-align: center;

            opacity: 0;

            transform: scale(0.3);

            animation:
                zoomInSuccess 1.2s cubic-bezier(0.17, 0.67, 0.38, 1.2) forwards,
                pulseGlow 2s infinite ease-in-out 1.2s;
        }

        .splash-logo {

            width: 280px;

            max-width: 80vw;

            filter: drop-shadow(
                0 0 20px rgba(140, 0, 255, 0.6)
            );
        }



        /* ZOOM ANIMATION */
        @keyframes zoomInSuccess {

            0% {

                opacity: 0;

                transform: scale(0.3);

                filter: blur(10px);
            }

            70% {

                opacity: 1;

                transform: scale(1.05);

                filter: blur(0px);
            }

            100% {

                opacity: 1;

                transform: scale(1);
            }
        }



        /* PULSE EFFECT */
        @keyframes pulseGlow {

            0%, 100% {

                filter: drop-shadow(
                    0 0 20px rgba(140, 0, 255, 0.6)
                );
            }

            50% {

                filter: drop-shadow(
                    0 0 35px rgba(140, 0, 255, 0.9)
                );
            }
        }

    </style>
</head>

<body>

    <div class="logo-container">

        <img
            src="logo.png"
            alt="Binary Battle Logo"
            class="splash-logo"
        >

    </div>





    <!-- FIREBASE + AUTO LOGIN -->
    <script type="module">

        import { initializeApp }
        from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

        import {
            getAuth,
            onAuthStateChanged
        }
        from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";



        // FIREBASE CONFIG
        const firebaseConfig = {

            apiKey: "AIzaSyC5P3d9xk3XBrKTZw7aQFE2DhfOYsLsG_4",

            authDomain: "binary-battle-6917a.firebaseapp.com",

            projectId: "binary-battle-6917a",

            storageBucket: "binary-battle-6917a.firebasestorage.app",

            messagingSenderId: "411576208",

            appId: "1:411576208:web:1acb62c098fbdb550e7515",

            measurementId: "G-QHKKXN93P6"
        };



        // INITIALIZE FIREBASE
        const app = initializeApp(firebaseConfig);

        const auth = getAuth(app);




        // WAIT 3 SECONDS THEN CHECK LOGIN
        setTimeout(() => {

            onAuthStateChanged(auth, (user) => {

                // FADE OUT EFFECT
                document.body.style.transition =
                    "opacity 0.5s ease";

                document.body.style.opacity = "0";



                setTimeout(() => {

                    // USER ALREADY LOGGED IN
                    if (user) {

                        window.location.href = "home/home.html";
                    }

                    // USER NOT LOGGED IN
                    else {

                        window.location.href = "login.html";
                    }

                }, 500);

            });

        }, 3000);

    </script>

</body>
</html>
