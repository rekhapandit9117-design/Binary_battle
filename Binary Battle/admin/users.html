<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Binary Battle</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05010a;
            --panel: rgba(15, 10, 35, 0.95);
            --accent: #8c00ff;
            --cyan: #00e5ff;
            --danger: #ff2b56;
            --success: #00ff88;
            --border: rgba(140, 0, 255, 0.3);
            --gold: #ffb800;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rajdhani', sans-serif; }
        body { background: var(--bg); color: #fff; padding-bottom: 110px; min-height: 100vh; }

        .top-nav {
            background: linear-gradient(to bottom, rgba(140, 0, 255, 0.15), transparent);
            padding: 20px; display: flex; align-items: center; gap: 20px;
            position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px);
        }

        .back-btn {
            width: 40px; height: 40px; background: var(--panel); border: 1px solid var(--cyan);
            border-radius: 10px; display: flex; align-items: center; justify-content: center;
            color: var(--cyan); text-decoration: none; transition: 0.3s;
        }
        .back-btn:hover { background: var(--cyan); color: #000; box-shadow: 0 0 15px var(--cyan); }

        .container { max-width: 1100px; margin: 0 auto; padding: 15px; }

        .selector-section {
            background: var(--panel); padding: 20px; border-radius: 20px;
            border: 1px solid var(--border); margin-bottom: 20px; text-align: center;
        }

        select {
            background: #000; color: var(--cyan); border: 1px solid var(--accent);
            padding: 12px; border-radius: 12px; font-family: 'Orbitron';
            width: 100%; max-width: 400px; outline: none;
        }

        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .stat-card { background: var(--panel); padding: 15px; border-radius: 15px; border: 1px solid var(--border); text-align: center; }
        .stat-card h2 { font-family: 'Orbitron'; font-size: 20px; color: var(--cyan); }

        .roster-card { background: var(--panel); border-radius: 20px; border: 1px solid var(--border); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { background: rgba(140, 0, 255, 0.1); color: var(--cyan); padding: 15px; text-align: left; font-family: 'Orbitron'; font-size: 11px; }
        td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); }

        .team-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
        .p-box { background: rgba(255,255,255,0.05); padding: 8px; border-radius: 8px; border-left: 3px solid var(--cyan); }
        .p-box b { display: block; font-size: 16px; }
        .p-box small { font-size: 10px; color: var(--gold); text-transform: uppercase; }

        /* NEW CSS FOR INPUTS & DISTRIBUTE BUTTON */
        .prize-input {
            background: #000; color: var(--gold); border: 1px solid var(--border);
            padding: 10px; border-radius: 8px; font-family: 'Orbitron';
            width: 90px; text-align: center; outline: none; font-size: 14px;
        }
        .prize-input:focus { border-color: var(--cyan); box-shadow: 0 0 10px var(--cyan); }
        
        .distribute-btn {
            width: 100%; padding: 18px; background: rgba(140, 0, 255, 0.2);
            border: none; border-top: 1px solid var(--border); color: var(--cyan);
            font-family: 'Orbitron'; font-weight: 700; font-size: 16px; 
            cursor: pointer; transition: 0.3s;
        }
        .distribute-btn:hover { background: var(--cyan); color: #000; }
        .distribute-btn:disabled { background: #333; color: #888; cursor: not-allowed; }

        .winner-box {
            background: var(--panel); padding: 20px; border-radius: 20px;
            border: 1px solid var(--gold); margin-top: 20px; display: none;
            max-width: 600px; margin-left: auto; margin-right: auto;
            box-shadow: 0 0 20px rgba(255, 184, 0, 0.1);
        }
        .winner-box h3 { font-family: 'Orbitron'; color: var(--gold); font-size: 14px; margin-bottom: 15px; text-align: center; }
        .win-row { display: flex; gap: 10px; align-items: center; }
        .winner-box select { flex: 1; padding: 12px; font-size: 14px; background: #000; border-color: var(--gold); }
        
        .announce-btn {
            padding: 12px 25px; background: var(--gold); border: none;
            border-radius: 12px; color: #000; font-family: 'Orbitron';
            font-weight: 700; cursor: pointer; transition: 0.3s;
        }
        .announce-btn:hover { background: #fff; box-shadow: 0 0 15px #fff; }

        .bottom-dash {
            position: fixed; bottom: 0; left: 0; width: 100%; background: #0d0616;
            border-top: 1px solid #2d1b4d; display: flex; justify-content: space-around;
            align-items: center; padding: 15px 10px; z-index: 1000;
        }
        .dash-item { text-align: center; color: #a5a5a5; text-decoration: none; flex: 1; transition: 0.3s; cursor: pointer; }
        .dash-item i { font-size: 22px; display: block; margin-bottom: 5px; }
        .dash-item span { font-size: 10px; font-weight: 700; font-family: 'Orbitron'; text-transform: uppercase; letter-spacing: 1px; }
        .dash-item.active { color: var(--accent); }

        #notification-container { position: fixed; top: 30px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast { min-width: 280px; padding: 16px 20px; border-radius: 15px; background: var(--panel); border-left: 5px solid var(--cyan); box-shadow: 0 10px 20px rgba(0,0,0,0.4); display: flex; align-items: center; gap: 15px; animation: slideIn 0.5s ease forwards; }
        .toast.error { border-color: var(--danger); }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    </style>
</head>
<body>

    <nav class="top-nav">
        <a href="adminhome.html" class="back-btn"><i class="fa-solid fa-chevron-left"></i></a>
        <h2 style="font-family: 'Orbitron'; font-size: 18px;">Player Roster</h2>
    </nav>

    <div class="container">
        <div class="selector-section">
            <select id="matchSelect">
                <option value="">-- SELECT LIVE TOURNAMENT --</option>
            </select>
        </div>

        <div class="stats">
            <div class="stat-card">
                <span>MODE</span>
                <h2 id="mType">N/A</h2>
            </div>
            <div class="stat-card">
                <span>SLOTS</span>
                <h2 id="mSlots">0</h2>
            </div>
        </div>

        <div class="roster-card">
            <table>
                <thead>
                    <tr>
                        <th width="80px">SLOT</th>
                        <th>TEAM MEMBERS</th>
                        <!-- UPDATED TO AMOUNT DISTRIBUTOR HEADER -->
                        <th width="120px">REWARD (₹)</th> 
                    </tr>
                </thead>
                <tbody id="rosterBody">
                    <tr><td colspan="3" style="text-align:center; padding: 40px; opacity: 0.4;">Select a match above...</td></tr>
                </tbody>
            </table>
            <!-- NEW DISTRIBUTE BUTTON -->
            <button id="distributeAllBtn" class="distribute-btn" style="display:none;"><i class="fa-solid fa-coins"></i> DISTRIBUTE TO ALL</button>
        </div>

        <!-- COMPACT WINNER BOX (KEPT AS IS) -->
        <div id="winnerSection" class="winner-box">
            <h3><i class="fa-solid fa-trophy"></i> ANNOUNCE WINNER & CREDIT WALLET</h3>
            <div class="win-row">
                <select id="winnerSelect"><option value="">-- Select Winner --</option></select>
                <button class="announce-btn" id="submitResult">ANNOUNCE</button>
            </div>
        </div>
    </div>

    <div class="bottom-dash">
        <a href="adminhome.html" class="dash-item"><i class="fa-solid fa-chart-line"></i><span>Dashboard</span></a>
        <a href="userslist.html" class="dash-item active"><i class="fa-solid fa-users"></i><span>User List</span></a>
        <a href="tournament.html" class="dash-item"><i class="fa-solid fa-trophy"></i><span>Tournament</span></a>
        <a href="redeem.html" class="nav-link"><i class="fa fa-gift"></i><span>REDEEMS</span></a>
        <a href="withdrawal.html" class="dash-item"><i class="fa-solid fa-hand-holding-dollar"></i><span>Withdrawal</span></a>
    </div>

    <div id="notification-container"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { 
            getFirestore, collection, getDocs, doc, onSnapshot, 
            setDoc, query, where, updateDoc, increment
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC5P3d9xk3XBrKTZw7aQFE2DhfOYsLsG_4",
            authDomain: "binary-battle-6917a.firebaseapp.com",
            projectId: "binary-battle-6917a",
            storageBucket: "binary-battle-6917a.firebasestorage.app",
            messagingSenderId: "411576208",
            appId: "1:411576208:web:1acb62c098fbdb550e7515",
            measurementId: "G-QHKKXN93P6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentMatchId = "";
        let currentMatchData = null;

        function showToast(msg, type = 'success') {
            const container = document.getElementById('notification-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<i class="fa-solid fa-circle-check"></i> <div><b>${type.toUpperCase()}</b><br>${msg}</div>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        async function loadMatches() {
            try {
                const snap = await getDocs(collection(db, "tournaments"));
                snap.forEach(d => {
                    const m = d.data();
                    const opt = document.createElement('option');
                    opt.value = d.id;
                    opt.innerText = `[${m.match_time}] ${m.game_name || m.title}`;
                    document.getElementById('matchSelect').appendChild(opt);
                });
            } catch (e) { showToast("Firebase Error", 'error'); }
        }

        let unsub = null;
        document.getElementById('matchSelect').addEventListener('change', (e) => {
            const mid = e.target.value;
            currentMatchId = mid;
            if (!mid) { 
                document.getElementById('winnerSection').style.display = 'none'; 
                document.getElementById('distributeAllBtn').style.display = 'none'; 
                return; 
            }

            if (unsub) unsub();
            unsub = onSnapshot(doc(db, "tournaments", mid), (snap) => {
                if (!snap.exists()) return;
                const data = snap.data();
                currentMatchData = data;
                document.getElementById('mType').innerText = (data.match_type || data.type || "N/A").toUpperCase();
                
                const slots = data.slots || {};
                const keys = Object.keys(slots).sort((a,b) => Number(a) - Number(b));
                document.getElementById('mSlots').innerText = keys.length;
                
                const body = document.getElementById('rosterBody');
                body.innerHTML = '';

                const wSel = document.getElementById('winnerSelect');
                wSel.innerHTML = '<option value="">-- Select Winner --</option>';

                keys.forEach(id => {
                    const s = slots[id];
                    let gridHTML = '<div class="team-grid">';
                    
                    if(s.playerName) {
                        gridHTML += `
                            <div class="p-box">
                                <small>FF Name</small><b>${s.playerName}</b>
                                <small style="color:var(--cyan); text-transform:none;">${s.userEmail || 'No Email'}</small>
                            </div>`;
                        
                        if(s.userEmail) {
                            wSel.innerHTML += `<option value="${s.userEmail}">${s.playerName} (${s.userEmail})</option>`;
                        }
                    }
                    gridHTML += '</div>';

                    // NEW LOGIC TO ADD INPUT BOXES
                    const inputHTML = s.userEmail 
                        ? `<input type="number" class="prize-input" data-email="${s.userEmail}" value="0" min="0">` 
                        : `<span style="font-size:10px; color:gray;">NO EMAIL</span>`;

                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td><b style="color:var(--cyan); font-family:Orbitron;">#${id}</b></td>
                                    <td>${gridHTML}</td>
                                    <td>${inputHTML}</td>`;
                    body.appendChild(tr);
                });

                document.getElementById('winnerSection').style.display = 'block';
                // Show Distribute Button if there are players
                document.getElementById('distributeAllBtn').style.display = keys.length > 0 ? 'block' : 'none';
            });
        });


        // NEW DISTRIBUTE ALL FUNCTIONALITY
        document.getElementById('distributeAllBtn').addEventListener('click', async () => {
            const inputs = document.querySelectorAll('.prize-input');
            const btn = document.getElementById('distributeAllBtn');
            let totalDistributed = 0;
            let successCount = 0;

            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> PROCESSING...`;
            btn.disabled = true;

            try {
                for (let input of inputs) {
                    const amount = parseFloat(input.value);
                    const email = input.getAttribute('data-email');

                    // Only query and update if amount is greater than 0
                    if (amount > 0 && email) {
                        const usersRef = collection(db, "users");
                        const q = query(usersRef, where("email", "==", email));
                        const querySnapshot = await getDocs(q);

                        if (!querySnapshot.empty) {
                            const userDoc = querySnapshot.docs[0];
                            const userRef = doc(db, "users", userDoc.id);
                            
                            // Add amount to wallet balance
                            await updateDoc(userRef, {
                                wallet_balance: increment(amount),
                                total_earnings: increment(amount)
                            });
                            
                            totalDistributed += amount;
                            successCount++;
                        }
                    }
                }
                
                if (successCount > 0) {
                    showToast(`Success! ₹${totalDistributed} distributed to ${successCount} players.`);
                    // Reset inputs back to 0
                    inputs.forEach(input => input.value = "0");
                } else {
                    showToast(`No amounts greater than 0 were found.`, "error");
                }

            } catch (error) {
                showToast("Error processing distribution", "error");
                console.error(error);
            } finally {
                btn.innerHTML = `<i class="fa-solid fa-coins"></i> DISTRIBUTE TO ALL`;
                btn.disabled = false;
            }
        });


        // EXISTING ANNOUNCE WINNER LOGIC
        document.getElementById('submitResult').addEventListener('click', async () => {
            const winEmail = document.getElementById('winnerSelect').value;
            const prizeAmount = parseFloat(currentMatchData.prize_pool) || 0;

            if(!winEmail) return showToast("Select a winner", "error");

            try {
                await setDoc(doc(db, "completed_matches", currentMatchId), {
                    winner_email: winEmail,
                    prize_pool: prizeAmount,
                    mode: (currentMatchData.match_type || currentMatchData.type || "Battle"),
                    completed_at: Date.now()
                });

                const usersRef = collection(db, "users");
                const q = query(usersRef, where("email", "==", winEmail));
                const querySnapshot = await getDocs(q);

                if (!querySnapshot.empty) {
                    const userDoc = querySnapshot.docs[0];
                    const userRef = doc(db, "users", userDoc.id);
                    
                    await updateDoc(userRef, {
                        wallet_balance: increment(prizeAmount),
                        total_earnings: increment(prizeAmount)
                    });

                    showToast(`Success! ₹${prizeAmount} credited to ${winEmail}.`);
                } else {
                    showToast("Result saved, but user not found in database.", "error");
                }

                document.getElementById('winnerSection').style.display = 'none';
            } catch (e) { showToast("Error updating wallet", "error"); }
        });

        loadMatches();
    </script>
</body>
</html>
