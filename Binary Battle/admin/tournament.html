<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Tournament Manager</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #05010a; --card: rgba(18, 8, 30, 0.8); --accent: #8c00ff; --cyan: #00e5ff; --text-dim: #a5a5a5; --border: #2d1b4d; --glow: rgba(140, 0, 255, 0.3); --success: #00ff88; --live: #ff0055; --sidebar-bg: #0d0616; }
        
        body { background-color: var(--bg); color: #fff; font-family: 'Rajdhani', sans-serif; padding: 20px; padding-bottom: 100px; }
        .admin-container { max-width: 900px; margin: 0 auto; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        .admin-title { font-family: 'Orbitron'; font-size: 20px; color: var(--cyan); letter-spacing: 2px; }
        
        /* Form Styling */
        .form-card { background: var(--card); border: 1px solid var(--border); padding: 25px; border-radius: 20px; margin-bottom: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 12px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; }
        input, select { background: rgba(0,0,0,0.3); border: 1px solid var(--border); padding: 12px; border-radius: 10px; color: #fff; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--cyan); box-shadow: 0 0 10px var(--glow); }

        input[type="date"]::-webkit-calendar-picker-indicator,
        input[type="time"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }

        .btn-create { width: 100%; background: linear-gradient(90deg, var(--accent), var(--cyan)); border: none; padding: 15px; border-radius: 12px; color: #fff; font-family: 'Orbitron'; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .btn-create:hover { opacity: 0.9; transform: translateY(-2px); }

        /* Match List */
        .match-list-item { background: var(--card); border: 1px solid var(--border); border-radius: 15px; padding: 15px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .match-meta h4 { font-family: 'Orbitron'; color: var(--cyan); margin-bottom: 5px; }
        .match-meta p { font-size: 13px; margin: 2px 0; color: var(--text-dim); }
        .match-date-time { font-size: 12px; color: var(--accent); font-weight: 700; margin-bottom: 5px; display: block; }
        
        .status-badge { padding: 4px 10px; border-radius: 6px; font-size: 10px; font-weight: 800; text-transform: uppercase; }
        .status-scheduled { background: #2d1b4d; color: var(--cyan); }
        .status-live { background: var(--live); animation: blink 1s infinite; color: white; }
        .status-completed { background: var(--success); color: #000; }
        .status-refunded { background: #ffaa00; color: #000; }
        
        @keyframes blink { 50% { opacity: 0.5; } }
        
        .actions { display: flex; gap: 8px; }
        .action-btn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--border); background: rgba(255,255,255,0.05); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .action-btn:hover { background: var(--border); color: var(--cyan); }
        
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(5px); }
        .modal-content { background: var(--bg); margin: 50px auto; padding: 30px; border: 1px solid var(--border); width: 90%; max-width: 600px; border-radius: 20px; box-shadow: 0 0 50px var(--glow); }
        .type-tag { font-size: 10px; background: rgba(0, 229, 255, 0.1); color: var(--cyan); padding: 2px 6px; border-radius: 4px; margin-left: 10px; border: 1px solid var(--cyan); text-transform: uppercase; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--sidebar-bg); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; padding: 15px 10px; z-index: 1000; }
        .nav-link { text-align: center; color: var(--text-dim); text-decoration: none; flex: 1; transition: 0.3s; }
        .nav-link i { font-size: 20px; display: block; margin-bottom: 5px; }
        .nav-link span { font-size: 10px; font-weight: 700; font-family: 'Orbitron'; }
        .nav-link.active { color: var(--cyan); text-shadow: 0 0 10px var(--cyan); }

        .swal2-popup {
            background: var(--bg) !important;
            border: 1px solid var(--border) !important;
            color: #fff !important;
            border-radius: 20px !important;
            font-family: 'Rajdhani', sans-serif !important;
        }
        .swal2-title { font-family: 'Orbitron' !important; color: var(--cyan) !important; }
        .swal2-confirm { background: var(--accent) !important; box-shadow: 0 0 10px var(--accent) !important; }
        .swal2-cancel { background: #333 !important; }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <div class="admin-title">ARENA ADMIN</div>
            <button onclick="location.href='adminhome.html'" class="action-btn"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div class="form-card">
            <form id="tournamentForm">
                <div class="form-grid">
                    <div class="input-group"><label>Game Name</label><input type="text" id="gameName" required></div>
                    <div class="input-group">
                        <label>Match Type</label>
                        <select id="matchType">
                            <option value="solo">Solo</option>
                            <option value="duo">Duo</option>
                            <option value="squad">Squad</option>
                            <option value="1v1">1v1</option> 
                            <option value="1v1(head)">1v1(head)</option>
                            <option value="lw">LW</option>
                            <option value="free">Match Free</option>
                        </select>
                    </div>
                    <div class="input-group"><label>Prize Pool (₹)</label><input type="number" id="prizePool" required></div>
                    <div class="input-group"><label>Entry Fee (₹)</label><input type="number" id="entryFee" required></div>
                    <div class="input-group"><label>Per Kill (₹)</label><input type="number" id="perKill" required></div>
                    <div class="input-group"><label>Select Date</label><input type="date" id="matchDateInput" required></div>
                    <div class="input-group"><label>Select Time (AM/PM)</label><input type="time" id="matchTimeInput" required></div>
                </div>
                <button type="submit" class="btn-create" id="submitBtn">CREATE TOURNAMENT</button>
            </form>
        </div>

        <div id="adminMatchList"></div>
    </div>

    <div id="editModal" class="modal">
        <div class="modal-content">
            <h3 style="color:var(--cyan); margin-bottom:20px; font-family:'Orbitron'">EDIT MATCH</h3>
            <form id="editForm">
                <input type="hidden" id="editMatchId">
                <div class="form-grid">
                    <div class="input-group"><label>Game Name</label><input type="text" id="editGameName" required></div>
                    <div class="input-group"><label>Prize Pool</label><input type="number" id="editPrizePool" required></div>
                    <div class="input-group"><label>Entry Fee</label><input type="number" id="editEntryFee" required></div>
                    <div class="input-group"><label>Per Kill</label><input type="number" id="editPerKill" required></div>
                    <div class="input-group"><label>Room ID</label><input type="text" id="editRoomId"></div>
                    <div class="input-group"><label>Password</label><input type="text" id="editPassword"></div>
                </div>
                <button type="submit" class="btn-create">SAVE CHANGES</button>
                <button type="button" onclick="document.getElementById('editModal').style.display='none'" style="background:none; border:none; color:var(--text-dim); margin-top:15px; cursor:pointer; width:100%; font-weight:700">CANCEL</button>
            </form>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="adminhome.html" class="nav-link"><i class="fa fa-chart-line"></i><span>DASHBOARD</span></a>
        <a href="users.html" class="nav-link"><i class="fa fa-users"></i><span>USER LIST</span></a>
        <a href="tournament.html" class="nav-link active"><i class="fa fa-trophy"></i><span>TOURNAMENT</span></a>
           <a href="redeem.html" class="nav-link"><i class="fa fa-gift"></i><span>REDEEMS</span></a>
        <a href="withdrawal.html" class="nav-link"><i class="fa-solid fa-hand-holding-dollar"></i><span>WITHDRAWAL</span></a>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, query, orderBy, getDoc, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyC5P3d9xk3XBrKTZw7aQFE2DhfOYsLsG_4", authDomain: "binary-battle-6917a.firebaseapp.com", projectId: "binary-battle-6917a", storageBucket: "binary-battle-6917a.firebasestorage.app", messagingSenderId: "411576208", appId: "1:411576208:web:1acb62c098fbdb550e7515" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const today = new Date().toISOString().split('T')[0];
        document.getElementById('matchDateInput').setAttribute('min', today);

        const notify = {
            success: (msg) => Swal.fire({ icon: 'success', title: 'SUCCESS', text: msg, timer: 2000, showConfirmButton: false, toast: true, position: 'top-end' }),
            error: (msg) => Swal.fire({ icon: 'error', title: 'ERROR', text: msg, background: '#1a0a0a' }),
            confirm: async (title, text) => {
                const res = await Swal.fire({ title, text, icon: 'warning', showCancelButton: true, confirmButtonText: 'YES', cancelButtonText: 'NO' });
                return res.isConfirmed;
            }
        };

        async function cleanupExpiredMatches() {
            try {
                const fifteenMinutesAgo = new Date(Date.now() - 15 * 60 * 1000);
                const q = query(collection(db, "tournaments"), where("status", "==", "completed"));
                const querySnapshot = await getDocs(q);
                querySnapshot.forEach(async (tDoc) => {
                    const data = tDoc.data();
                    if (data.completed_at && data.completed_at.toDate() < fifteenMinutesAgo) {
                        await deleteDoc(doc(db, "tournaments", tDoc.id));
                    }
                });
            } catch (e) { console.error("Cleanup error", e); }
        }
        cleanupExpiredMatches();

        const form = document.getElementById('tournamentForm');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const selectedDate = document.getElementById('matchDateInput').value;
            const selectedTime = document.getElementById('matchTimeInput').value;
            const selectedDateTime = new Date(`${selectedDate}T${selectedTime}`);
            const now = new Date();

            if (selectedDateTime <= now) {
                return notify.error("Match time must be in the future!");
            }

            const btn = document.getElementById('submitBtn');
            btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> CREATING...';
            btn.disabled = true;

            const displayDate = selectedDateTime.toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hour12: true });

            try {
                await addDoc(collection(db, "tournaments"), {
                    game_name: document.getElementById('gameName').value,
                    match_type: document.getElementById('matchType').value,
                    prize_pool: document.getElementById('prizePool').value,
                    entry_fee: document.getElementById('entryFee').value,
                    per_kill: document.getElementById('perKill').value,
                    match_date: displayDate, 
                    raw_timestamp: selectedDateTime, 
                    status: 'scheduled',
                    created_at: new Date()
                });
                notify.success("Tournament Created Successfully!");
                form.reset();
            } catch (err) {
                notify.error("Failed to create tournament.");
            } finally {
                btn.innerHTML = 'CREATE TOURNAMENT';
                btn.disabled = false;
            }
        });

        onSnapshot(query(collection(db, "tournaments"), orderBy("created_at", "desc")), (snapshot) => {
            const listArea = document.getElementById('adminMatchList');
            listArea.innerHTML = '';
            snapshot.forEach(d => {
                const data = d.data();
                listArea.innerHTML += `
                    <div class="match-list-item">
                        <div class="match-meta">
                            <span class="match-date-time"><i class="fa-regular fa-clock"></i> ${data.match_date}</span>
                            <h4>${data.game_name} <span class="type-tag">${data.match_type}</span></h4> 
                            <p>Prize: ₹${data.prize_pool} | Fee: ₹${data.entry_fee} | Kill: ₹${data.per_kill || 0}</p>
                            <span class="status-badge status-${data.status}">${data.status}</span>
                        </div>
                        <div class="actions">
                            <button class="action-btn" onclick="openEditModal('${d.id}')" title="Edit"><i class="fa-solid fa-pen"></i></button>
                            <button class="action-btn" style="color:var(--cyan)" onclick="refundTournament('${d.id}')" title="Refund All"><i class="fa-solid fa-rotate-left"></i></button>
                            <button class="action-btn" style="color:var(--live)" onclick="updateStatus('${d.id}', 'live')" title="Go Live"><i class="fa-solid fa-tower-broadcast"></i></button>
                            <button class="action-btn" style="color:var(--success)" onclick="markAsCompleted('${d.id}')" title="Mark Complete"><i class="fa-solid fa-check"></i></button>
                            <button class="action-btn" onclick="deleteTournament('${d.id}')" title="Delete"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>`;
            });
        });

        window.openEditModal = async (id) => {
            try {
                const snap = await getDoc(doc(db, "tournaments", id));
                const data = snap.data();
                document.getElementById('editMatchId').value = id;
                document.getElementById('editGameName').value = data.game_name;
                document.getElementById('editPrizePool').value = data.prize_pool;
                document.getElementById('editEntryFee').value = data.entry_fee;
                document.getElementById('editPerKill').value = data.per_kill || 0;
                document.getElementById('editRoomId').value = data.room_id || '';
                document.getElementById('editPassword').value = data.password || '';
                document.getElementById('editModal').style.display = "block";
            } catch (e) { notify.error("Could not fetch match data."); }
        };

        document.getElementById('editForm').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('editMatchId').value;
            try {
                await updateDoc(doc(db, "tournaments", id), {
                    game_name: document.getElementById('editGameName').value,
                    prize_pool: document.getElementById('editPrizePool').value,
                    entry_fee: document.getElementById('editEntryFee').value,
                    per_kill: document.getElementById('editPerKill').value,
                    room_id: document.getElementById('editRoomId').value,
                    password: document.getElementById('editPassword').value
                });
                notify.success("Match updated!");
                document.getElementById('editModal').style.display = "none";
            } catch (e) { notify.error("Update failed."); }
        };

        window.updateStatus = async (id, status) => { 
            try {
                await updateDoc(doc(db, "tournaments", id), { status }); 
                notify.success(`Status updated to ${status}`);
            } catch (e) { notify.error("Status update failed."); }
        };

        window.refundTournament = async (id) => {
            const confirmed = await notify.confirm("REFUND ALL PLAYERS?", "This will change match status to Refunded.");
            if (confirmed) {
                try {
                    await updateDoc(doc(db, "tournaments", id), { status: 'refunded' });
                    notify.success("Match Refunded!");
                } catch (e) { notify.error("Refund failed."); }
            }
        };

        window.markAsCompleted = async (id) => {
            const confirmed = await notify.confirm("END MATCH?", "Match will be completed and deleted in 15 mins.");
            if (confirmed) {
                try {
                    await updateDoc(doc(db, "tournaments", id), { 
                        status: 'completed',
                        completed_at: new Date()
                    });
                    notify.success("Match marked as Completed!");
                } catch (e) { notify.error("Action failed."); }
            }
        };

        window.deleteTournament = async (id) => { 
            const confirmed = await notify.confirm("DELETE PERMANENTLY?", "This action cannot be undone.");
            if (confirmed) {
                try {
                    await deleteDoc(doc(db, "tournaments", id));
                    notify.success("Tournament deleted.");
                } catch (e) { notify.error("Delete failed."); }
            }
        };
    </script>
</body>
</html>
