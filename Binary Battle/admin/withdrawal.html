<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binary Battle | Admin Terminal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05010a;
            --card-glass: rgba(18, 8, 30, 0.8);
            --accent: #8c00ff;
            --cyan: #00e5ff;
            --success: #00ff88;
            --danger: #ff3366;
            --border: rgba(140, 0, 255, 0.2);
            --glow: rgba(140, 0, 255, 0.4);
            --sidebar-bg: #0d0616;
            --text-dim: #a5a5a5;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rajdhani', sans-serif; }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(140, 0, 255, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(0, 229, 255, 0.05) 0%, transparent 40%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
            padding-bottom: 100px; /* Space for bottom nav */
            background-attachment: fixed;
        }

        /* Header Styling */
        .admin-header {
            max-width: 800px;
            margin: 0 auto 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
        }

        .header-left { display: flex; align-items: center; gap: 15px; }

        .back-btn {
            background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; transition: 0.3s;
        }
        .back-btn:hover { color: var(--cyan); transform: translateX(-3px); }

        .admin-header h2 {
            font-family: 'Orbitron';
            font-size: 22px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--cyan);
            text-shadow: 0 0 10px var(--cyan);
        }

        .stats-tag {
            background: rgba(0, 229, 255, 0.1);
            color: var(--cyan);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            border: 1px solid var(--cyan);
        }

        /* Container */
        #adminList {
            max-width: 800px;
            margin: 0 auto;
        }

        /* Premium Card Design */
        .request-card {
            background: var(--card-glass);
            border: 1px solid var(--border);
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(12px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .request-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
            box-shadow: 0 10px 30px rgba(140, 0, 255, 0.2);
        }

        .request-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--cyan);
        }

        .info strong {
            display: block;
            font-family: 'Orbitron';
            color: #fff;
            font-size: 16px;
            margin-bottom: 8px;
        }

        .info span {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #a5a5a5;
            margin-top: 4px;
        }

        .info i { color: var(--cyan); width: 16px; }

        .amt-area { text-align: right; }

        .amt {
            font-family: 'Orbitron';
            color: var(--success);
            font-size: 24px;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
        }

        .approve-btn {
            background: linear-gradient(135deg, var(--success), #00cc6a);
            color: #000;
            border: none;
            padding: 12px 25px;
            border-radius: 12px;
            font-family: 'Orbitron';
            font-weight: 800;
            font-size: 12px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .approve-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px var(--success);
        }

        /* Bottom Nav Styles */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: var(--sidebar-bg); border-top: 1px solid var(--border);
            display: flex; justify-content: space-around; align-items: center;
            padding: 15px 10px; z-index: 1000;
        }
        .nav-link {
            text-align: center; color: var(--text-dim); text-decoration: none;
            flex: 1; transition: 0.3s; cursor: pointer;
        }
        .nav-link i { font-size: 20px; display: block; margin-bottom: 5px; }
        .nav-link span { font-size: 10px; font-weight: 700; font-family: 'Orbitron'; }
        .nav-link:hover, .nav-link.active { color: var(--cyan); }

        /* Stylish Modal Popup */
        #customModal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 9999; display: none;
            align-items: center; justify-content: center; backdrop-filter: blur(8px);
        }

        .modal-content {
            background: #12081e;
            border: 1px solid var(--accent);
            width: 90%; max-width: 400px;
            border-radius: 24px; padding: 35px 25px;
            text-align: center;
            box-shadow: 0 0 50px rgba(140, 0, 255, 0.3);
            animation: popUp 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes popUp { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .modal-icon { font-size: 50px; color: var(--cyan); margin-bottom: 20px; }
        .modal-title { font-family: 'Orbitron'; font-size: 20px; margin-bottom: 15px; }
        .modal-text { color: #a5a5a5; margin-bottom: 30px; line-height: 1.6; }

        .modal-btns { display: flex; gap: 15px; }
        .m-btn {
            flex: 1; padding: 15px; border-radius: 12px; border: none;
            font-family: 'Orbitron'; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .btn-confirm { background: var(--success); color: #000; }
        .btn-cancel { background: rgba(255,255,255,0.05); color: #fff; border: 1px solid var(--border); }

        #loader { text-align: center; padding: 50px; font-family: 'Orbitron'; color: var(--cyan); }
        .no-data { text-align: center; padding: 50px; color: var(--text-dim); border: 1px dashed var(--border); border-radius: 20px; }
    </style>
</head>
<body>

    <!-- Premium Custom Modal -->
    <div id="customModal">
        <div class="modal-content">
            <div class="modal-icon"><i class="fa-solid fa-shield-halved"></i></div>
            <div class="modal-title" id="mTitle">Verify Action</div>
            <div class="modal-text" id="mText">Do you want to proceed with this approval?</div>
            <div class="modal-btns">
                <button class="m-btn btn-cancel" onclick="closeModal()">Cancel</button>
                <button class="m-btn btn-confirm" id="mConfirm">Confirm</button>
            </div>
        </div>
    </div>

    <div class="admin-header">
        <div class="header-left">
            <button class="back-btn" onclick="history.back()"><i class="fa-solid fa-arrow-left"></i></button>
            <h2>Withdrawal Terminal</h2>
        </div>
        <div class="stats-tag" id="reqCount">Requests: 0</div>
    </div>

    <div id="adminList">
        <div id="loader"><i class="fa fa-circle-notch fa-spin"></i> Initializing...</div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="adminhome.html" class="nav-link"><i class="fa fa-chart-line"></i><span>DASHBOARD</span></a>
        <a href="users.html" class="nav-link"><i class="fa fa-users"></i><span>USER LIST</span></a>
        <a href="tournament.html" class="nav-link"><i class="fa fa-trophy"></i><span>TOURNAMENT</span></a>
           <a href="redeem.html" class="nav-link"><i class="fa fa-gift"></i><span>REDEEMS</span></a>
        <a href="withdrawal.html" class="nav-link active"><i class="fa fa-hand-holding-dollar"></i><span>WITHDRAWAL</span></a>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, query, where, onSnapshot, doc, updateDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC5P3d9xk3XBrKTZw7aQFE2DhfOYsLsG_4",
            authDomain: "binary-battle-6917a.firebaseapp.com",
            projectId: "binary-battle-6917a",
            storageBucket: "binary-battle-6917a.firebasestorage.app",
            messagingSenderId: "411576208",
            appId: "1:411576208:web:1acb62c098fbdb550e7515"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let activeAction = null;
        window.closeModal = () => document.getElementById('customModal').style.display = 'none';

        function openModal(title, text, onConfirm) {
            document.getElementById('mTitle').innerText = title;
            document.getElementById('mText').innerText = text;
            document.getElementById('customModal').style.display = 'flex';
            document.getElementById('mConfirm').onclick = () => {
                onConfirm();
                closeModal();
            };
        }

        const q = query(collection(db, "withdrawals"), where("status", "==", "PENDING"));

        onSnapshot(q, (snapshot) => {
            const adminList = document.getElementById('adminList');
            document.getElementById('reqCount').innerText = `Requests: ${snapshot.size}`;
            adminList.innerHTML = '';

            if (snapshot.empty) {
                adminList.innerHTML = '<div class="no-data"><i class="fa-solid fa-ghost" style="font-size:40px; margin-bottom:10px; opacity:0.5"></i><br>All clear! No pending requests.</div>';
                return;
            }

            snapshot.forEach((docSnap) => {
                const req = docSnap.data();
                const id = docSnap.id;

                adminList.innerHTML += `
                    <div class="request-card">
                        <div class="info">
                            <strong><i class="fa-solid fa-wallet"></i> UPI: ${req.upi_id}</strong>
                            <span><i class="fa-solid fa-user"></i> ID: ${req.uid.substring(0,10)}...</span>
                            <span><i class="fa-solid fa-calendar"></i> ${new Date(req.timestamp).toLocaleString()}</span>
                        </div>
                        <div class="amt-area">
                            <div class="amt">₹${req.receive}</div>
                            <button class="approve-btn" onclick="triggerApprove('${req.uid}', '${id}', ${req.receive})">Approve</button>
                        </div>
                    </div>
                `;
            });
        });

        window.triggerApprove = (uid, requestId, amount) => {
            openModal(
                'Confirm Payout', 
                `Are you sure you have transferred ₹${amount} to the UPI ID? This action cannot be undone.`,
                () => executeApprove(uid, requestId)
            );
        };

        async function executeApprove(uid, requestId) {
            try {
                const batch = writeBatch(db);
                const globalRef = doc(db, "withdrawals", requestId);
                batch.update(globalRef, { status: "SUCCESS" });

                const userTxnRef = doc(db, "users", uid, "transactions", requestId);
                batch.update(userTxnRef, { status: "SUCCESS" });

                await batch.commit();
                const btn = document.querySelector(`button[onclick*="${requestId}"]`);
                if(btn) {
                    btn.innerText = "APPROVED";
                    btn.style.background = "#888";
                    btn.disabled = true;
                }
            } catch (e) {
                console.error(e);
                alert("Critical System Error. Check Console.");
            }
        }
    </script>
</body>
</html>
