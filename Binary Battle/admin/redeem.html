<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Redeem Approvals</title>
  <!-- Font Awesome CDN for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-color: #070a12;
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      --success-color: #10b981;
      --pending-color: #f59e0b;
      --radius-lg: 20px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      padding: 30px 20px 90px 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 10px 18px;
      border-radius: var(--radius-md);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: all 0.25s ease;
      text-decoration: none;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateX(-3px);
    }

    .back-btn svg {
      width: 18px;
      height: 18px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--card-border);
    }

    .header h1 {
      font-size: 1.8rem;
      background: linear-gradient(135deg, #fff, #a855f7);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .badge-count {
      background: rgba(168, 85, 247, 0.2);
      color: #a855f7;
      border: 1px solid rgba(168, 85, 247, 0.4);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .requests-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .request-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 24px;
      backdrop-filter: blur(16px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .request-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 12px;
    }

    .user-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .user-id {
      font-family: monospace;
      font-size: 0.95rem;
      color: #818cf8;
      font-weight: 600;
    }

    .request-time {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .status-tag {
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      font-weight: 700;
      text-transform: uppercase;
    }

    .status-pending {
      background: rgba(245, 158, 11, 0.15);
      color: var(--pending-color);
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .status-completed {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success-color);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .amount-details {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
      background: rgba(255, 255, 255, 0.02);
      padding: 12px 16px;
      border-radius: var(--radius-md);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .detail-box {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .detail-box label {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .detail-box span {
      font-size: 1rem;
      font-weight: 700;
    }

    .action-section {
      display: flex;
      gap: 12px;
      align-items: center;
      padding-top: 12px;
      border-top: 1px dashed var(--card-border);
    }

    .code-input {
      flex: 1;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      font-family: monospace;
      font-size: 1rem;
      letter-spacing: 1px;
      outline: none;
      text-transform: uppercase;
      transition: border-color 0.2s ease;
    }

    .code-input:focus {
      border-color: #a855f7;
    }

    .submit-btn {
      background: var(--primary-gradient);
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: var(--radius-md);
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease;
      white-space: nowrap;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      border: 1px solid var(--card-border);
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--card-border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 10px 0;
      z-index: 1000;
      box-shadow: 0 -10px 25px rgba(0, 0, 0, 0.5);
    }

    .nav-link {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
      width: 20%;
      text-align: center;
    }

    .nav-link i {
      font-size: 1.2rem;
      transition: transform 0.2s ease;
    }

    .nav-link:hover, .nav-link.active {
      color: #a855f7;
    }

    .nav-link.active i {
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="nav-bar">
      <button class="back-btn" onclick="window.history.back()">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path>
        </svg>
        Back to User App
      </button>
    </div>

    <div class="header">
      <h1>Admin Redeem Management</h1>
      <div class="badge-count" id="totalRequests">Total Requests: 0</div>
    </div>

    <div class="requests-list" id="requestsList">
      <div class="empty-state">Loading redeem requests...</div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="adminhome.html" class="nav-link"><i class="fa fa-chart-line"></i><span>DASHBOARD</span></a>
    <a href="users.html" class="nav-link"><i class="fa fa-users"></i><span>USER LIST</span></a>
    <a href="tournament.html" class="nav-link"><i class="fa fa-trophy"></i><span>TOURNAMENT</span></a>
    <a href="redeem.html" class="nav-link active"><i class="fa fa-gift"></i><span>REDEEMS</span></a>
    <a href="withdrawal.html" class="nav-link"><i class="fa fa-hand-holding-dollar"></i><span>WITHDRAWAL</span></a>
  </nav>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      onSnapshot, 
      doc, 
      updateDoc, 
      query, 
      orderBy 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC5P3d9xk3XBrKTZw7aQFE2DhfOYsLsG_4",
      authDomain: "binary-battle-6917a.firebaseapp.com",
      projectId: "binary-battle-6917a",
      storageBucket: "binary-battle-6917a.firebasestorage.app",
      messagingSenderId: "411576208",
      appId: "1:411576208:web:1acb62c098fbdb550e7515",
      measurementId: "G-QHKKXN93P6"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const requestsListEl = document.getElementById('requestsList');
    const totalRequestsEl = document.getElementById('totalRequests');

    const listenToRequests = () => {
      const redeemRef = collection(db, "redeem code");
      const q = query(redeemRef, orderBy("timestamp", "desc"));

      onSnapshot(q, (snapshot) => {
        totalRequestsEl.textContent = `Total Requests: ${snapshot.size}`;

        if (snapshot.empty) {
          requestsListEl.innerHTML = `<div class="empty-state">No redeem requests found.</div>`;
          return;
        }

        requestsListEl.innerHTML = '';

        snapshot.forEach((docSnap) => {
          const req = docSnap.data();
          const docId = docSnap.id;

          const dateStr = req.timestamp ? new Date(req.timestamp.toDate()).toLocaleString() : 'Just now';
          const isCompleted = req.status === "Success" || req.status === "Approved";
          const currentCode = req.redeemCode && req.redeemCode !== 'RC-XXXX-XXXX' ? req.redeemCode : '';

          const card = document.createElement('div');
          card.className = 'request-card';

          card.innerHTML = `
            <div class="request-header">
              <div class="user-info">
                <span class="user-id">User ID: ${req.userId || 'Unknown'}</span>
                <span class="request-time">${dateStr}</span>
              </div>
              <span class="status-tag ${isCompleted ? 'status-completed' : 'status-pending'}">
                ${isCompleted ? 'Approved' : 'Pending'}
              </span>
            </div>

            <div class="amount-details">
              <div class="detail-box">
                <label>Redeem Amount</label>
                <span>₹${req.amount || 0}</span>
              </div>
              <div class="detail-box">
                <label>Platform Fee (${req.feePercent || 0}%)</label>
                <span style="color: #ef4444;">+₹${req.feeAmount || 0}</span>
              </div>
              <div class="detail-box">
                <label>Total Paid</label>
                <span style="color: #10b981;">₹${req.totalPaid || (req.amount + (req.feeAmount || 0))}</span>
              </div>
            </div>

            <div class="action-section">
              <input 
                type="text" 
                class="code-input" 
                id="input-${docId}" 
                placeholder="Enter Redeem Code (e.g. RC-X9Y2-88KL)" 
                value="${currentCode}"
                oninput="this.value = this.value.toUpperCase()"
              />
              <button class="submit-btn" id="btn-${docId}">
                ${isCompleted ? 'Resend Code' : 'Send Code'}
              </button>
            </div>
          `;

          requestsListEl.appendChild(card);

          setTimeout(() => {
            const btn = document.getElementById(`btn-${docId}`);
            if (btn) {
              btn.addEventListener('click', () => sendRedeemCode(docId));
            }
          }, 0);
        });
      }, (error) => {
        console.error("Error fetching requests:", error);
        requestsListEl.innerHTML = `<div class="empty-state">Error loading requests. Check Firebase permissions.</div>`;
      });
    };

    async function sendRedeemCode(docId) {
      const inputEl = document.getElementById(`input-${docId}`);
      const codeValue = inputEl ? inputEl.value.trim().toUpperCase() : '';

      if (!codeValue) {
        alert("Please enter a valid Redeem Code first!");
        return;
      }

      try {
        const docRef = doc(db, "redeem code", docId);
        await updateDoc(docRef, {
          redeemCode: codeValue,
          status: "Success"
        });

        alert(`Code "${codeValue}" sent successfully to the user!`);
      } catch (err) {
        console.error("Failed to update code:", err);
        alert("Failed to update redeem code. Please try again.");
      }
    }

    listenToRequests();
  </script>
</body>
</html>
