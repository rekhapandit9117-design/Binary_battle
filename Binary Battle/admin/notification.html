<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Notification Center | Binary Battle</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --bg: #05010a; 
            --card: rgba(25, 10, 50, 0.8); 
            --accent: #8c00ff; 
            --cyan: #00e5ff; 
            --border: #2d1b4d; 
            --error: #ff0055;
            --success: #00ff66;
            --text-muted: #a5a5a5;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rajdhani', sans-serif; }
        body { background: var(--bg); color: #fff; min-height: 100vh; background-image: radial-gradient(circle at 50% -20%, #2d1b4d 0%, transparent 60%); }
        
        .header { padding: 30px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; max-width: 800px; margin: 0 auto; gap: 15px; }
        .header-left { display: flex; align-items: center; gap: 20px; }
        
        .back-btn { width: 45px; height: 45px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; display: flex; align-items: center; justify-content: center; color: var(--cyan); text-decoration: none; transition: 0.3s; }
        .back-btn:hover { border-color: var(--cyan); background: rgba(0, 229, 255, 0.05); box-shadow: 0 0 15px rgba(0, 229, 255, 0.2); }
        
        .title-group h1 { font-family: 'Orbitron'; font-size: 24px; color: #fff; letter-spacing: 1px; }
        .title-group p { font-size: 14px; color: #aaa; margin-top: 4px; }

        .container { padding: 30px 20px; max-width: 800px; margin: 0 auto; }
        
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: clamp(20px, 5vw, 40px); backdrop-filter: blur(12px); box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        
        .form-group { margin-bottom: 25px; }
        .form-group label { display: block; font-family: 'Orbitron'; font-size: 14px; color: var(--cyan); letter-spacing: 1px; margin-bottom: 10px; text-transform: uppercase; }
        
        .form-group input, .form-group textarea {
            width: 100%; background: #12081f; border: 1px solid var(--border); border-radius: 12px; color: #fff; padding: 15px; font-size: 16px; outline: none; transition: 0.3s;
        }
        .form-group input:focus, .form-group textarea:focus { border-color: var(--accent); box-shadow: 0 0 15px rgba(140, 0, 255, 0.2); }
        .form-group textarea { resize: none; height: 150px; }

        .btn-submit {
            width: 100%; padding: 16px; border: none; border-radius: 12px;
            background: linear-gradient(90deg, #6a00ff, var(--accent));
            color: #fff; font-family: 'Orbitron'; font-weight: 700; font-size: 16px; letter-spacing: 2px;
            text-transform: uppercase; cursor: pointer; transition: 0.3s; box-shadow: 0 0 20px rgba(140, 0, 255, 0.3);
        }
        .btn-submit:hover { box-shadow: 0 0 30px rgba(140, 0, 255, 0.6); transform: translateY(-2px); }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(2, 0, 10, 0.9); display: none; align-items: center; justify-content: center; z-index: 5000; backdrop-filter: blur(12px); }
        .custom-popup { width: 88%; max-width: 340px; background: linear-gradient(145deg, #160a2d, #05010a); border-radius: 30px; text-align: center; overflow: hidden; border: 1px solid var(--border); box-shadow: 0 25px 60px rgba(0,0,0,0.9); animation: premiumPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes premiumPop { from { transform: scale(0.6) translateY(50px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }
        .popup-content { padding: 35px 25px; }
        .popup-icon-wrapper { width: 65px; height: 65px; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); }
        .popup-icon { font-size: 28px; }
        .popup-title { font-family: 'Orbitron'; font-size: 16px; font-weight: 700; margin-bottom: 10px; color: #fff; letter-spacing: 1px; text-transform: uppercase; }
        .popup-text { font-size: 14px; color: var(--text-muted); line-height: 1.5; }
        .popup-btn { width: 100%; padding: 18px; background: rgba(255,255,255,0.02); border: none; border-top: 1px solid var(--border); color: var(--accent); font-family: 'Orbitron'; font-weight: 700; font-size: 14px; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; }
    </style>
</head>
<body>

    <div class="modal-overlay" id="modalOverlay">
        <div class="custom-popup">
            <div class="popup-content">
                <div class="popup-icon-wrapper">
                    <i id="popupIcon" class="fa-solid fa-circle-info popup-icon"></i>
                </div>
                <h3 id="popupTitle" class="popup-title">System Alert</h3>
                <p id="popupText" class="popup-text">Details will be shown here.</p>
            </div>
            <button class="popup-btn" id="popupCloseBtn">OK</button>
        </div>
    </div>

    <header class="header">
        <div class="header-left">
            <a href="adminhome.html" class="back-btn">
                <i class="fa-solid fa-chevron-left"></i>
            </a>
            <div class="title-group">
                <h1>Broadcast Center</h1>
                <p>Publish Global App Updates</p>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="card">
            <div class="form-group">
                <label for="updateTitle">Update Title</label>
                <input type="text" id="updateTitle" placeholder="e.g., Version 2.0 Maintenance Update">
            </div>

            <div class="form-group">
                <label for="updateMessage">Message / Notification Details</label>
                <textarea id="updateMessage" placeholder="Write down structural patch details or alert notices for players..."></textarea>
            </div>

            <button class="btn-submit" id="submitUpdateBtn">Publish Update</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC5P3d9xk3XBrKTZw7aQFE2DhfOYsLsG_4",
            authDomain: "binary-battle-6917a.firebaseapp.com",
            projectId: "binary-battle-6917a",
            storageBucket: "binary-battle-6917a.firebasestorage.app",
            messagingSenderId: "411576208",
            appId: "1:411576208:web:1acb62c098fbdb550e7515"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const showPopup = (type, heading, textMessage) => {
            const overlay = document.getElementById('modalOverlay');
            const icon = document.getElementById('popupIcon');
            const title = document.getElementById('popupTitle');
            const text = document.getElementById('popupText');
            
            overlay.style.display = 'flex';
            title.innerText = heading;
            text.innerText = textMessage;

            if (type === 'success') {
                icon.className = "fa-solid fa-circle-check popup-icon";
                icon.style.color = "var(--success)";
                title.style.color = "var(--success)";
            } else {
                icon.className = "fa-solid fa-circle-xmark popup-icon";
                icon.style.color = "var(--error)";
                title.style.color = "var(--error)";
            }
        };

        document.getElementById('popupCloseBtn').addEventListener('click', () => {
            document.getElementById('modalOverlay').style.display = 'none';
        });

        document.getElementById('submitUpdateBtn').addEventListener('click', async () => {
            const title = document.getElementById('updateTitle').value.trim();
            const message = document.getElementById('updateMessage').value.trim();
            const btn = document.getElementById('submitUpdateBtn');

            if (!title || !message) {
                showPopup('error', 'Fields Required', 'Please provide a title and a descriptive notification message.');
                return;
            }

            btn.disabled = true;
            btn.innerText = "Publishing Changes...";

            try {
                const updateRef = collection(db, "update");
                await addDoc(updateRef, {
                    title: title,
                    message: message,
                    timestamp: Date.now()
                });

                showPopup('success', 'Update Deployed', 'The notification has been securely saved to the database.');
                document.getElementById('updateTitle').value = "";
                document.getElementById('updateMessage').value = "";

            } catch (err) {
                showPopup('error', 'Execution Error', err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Publish Update";
            }
        });
    </script>
</body>
</html>
