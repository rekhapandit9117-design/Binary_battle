<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direct Reset | Binary Battle</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05010a;
            --card: rgba(18, 8, 30, 0.8);
            --cyan: #00e5ff;
            --accent: #8c00ff;
            --border: #2d1b4d;
        }

        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .reset-box {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            backdrop-filter: blur(10px);
            text-align: center;
        }

        .title { font-family: 'Orbitron'; color: var(--cyan); margin-bottom: 20px; }

        .input-group { margin-bottom: 15px; text-align: left; }
        label { display: block; font-size: 12px; color: var(--cyan); margin-bottom: 5px; }
        
        input {
            width: 100%;
            padding: 12px;
            background: #111;
            border: 1px solid var(--border);
            color: #fff;
            border-radius: 8px;
            outline: none;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, var(--accent), var(--cyan));
            border: none;
            color: white;
            font-family: 'Orbitron';
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #status { margin-top: 15px; font-size: 14px; font-weight: 700; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="reset-box">
        <h2 class="title">INSTANT RESET</h2>
        <form id="directResetForm">
            <div class="input-group">
                <label>REGISTERED EMAIL</label>
                <input type="email" id="email" required placeholder="Enter email">
            </div>
            <div class="input-group">
                <label>NEW PASSWORD</label>
                <input type="password" id="newPass" required placeholder="••••••••" minlength="6">
            </div>
            <div class="input-group">
                <label>CONFIRM PASSWORD</label>
                <input type="password" id="confirmPass" required placeholder="••••••••" minlength="6">
            </div>
            <button type="submit" class="btn" id="submitBtn">UPDATE PASSWORD</button>
            <div id="status"></div>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC5P3d9xk3XBrKTZw7aQFE2DhfOYsLsG_4",
            authDomain: "binary-battle-6917a.firebaseapp.com",
            projectId: "binary-battle-6917a",
            storageBucket: "binary-battle-6917a.firebasestorage.app",
            messagingSenderId: "411576208",
            appId: "1:411576208:web:1acb62c098fbdb550e7515"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('directResetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const newPass = document.getElementById('newPass').value;
            const confirmPass = document.getElementById('confirmPass').value;
            const status = document.getElementById('status');
            const submitBtn = document.getElementById('submitBtn');

            if (newPass !== confirmPass) {
                status.style.color = "red";
                status.innerText = "Passwords do not match!";
                return;
            }

            if (newPass.length < 6) {
                status.style.color = "red";
                status.innerText = "Password must be at least 6 characters!";
                return;
            }

            // Disable button and show processing status
            submitBtn.disabled = true;
            status.style.color = "var(--cyan)";
            status.innerText = "Verifying Identity...";

            try {
                // 1. Find the user record matching this specific email field in Firestore
                const usersRef = collection(db, "users");
                const q = query(usersRef, where("email", "==", email));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    status.style.color = "red";
                    status.innerText = "User account not found.";
                    submitBtn.disabled = false;
                    return;
                }

                // 2. Identify the target document ID row and write the updated key field
                const userDoc = querySnapshot.docs[0];
                await updateDoc(doc(db, "users", userDoc.id), {
                    password: newPass 
                });

                status.style.color = "#00ff88";
                status.innerText = "PASSWORD UPDATED SUCCESSFULLY!";
                
                // Redirect user back to login platform interface after 2 seconds
                setTimeout(() => {
                    window.location.href = "login.html";
                }, 2000);

            } catch (error) {
                console.error("Database connection fault: ", error);
                status.style.color = "red";
                status.innerText = "System error updating credentials.";
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
