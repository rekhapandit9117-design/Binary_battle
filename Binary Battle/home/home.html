<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Binary Battle | Esports Arena</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #05010a;
            --card: rgba(18, 8, 30, 0.6);
            --accent: #8c00ff;
            --cyan: #00e5ff;
            --text-dim: #a5a5a5;
            --border: #2d1b4d;
            --glow: rgba(140, 0, 255, 0.3);
            --success: #00c853;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rajdhani', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: #fff; min-height: 100vh; overflow-x: hidden; }
        .safe-area { padding: 30px 20px 120px; max-width: 600px; margin: 0 auto; }

        /* Header & Balance */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .welcome-section .hello { color: var(--cyan); font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; font-family: 'Orbitron'; }
        .welcome-section .name { font-size: 28px; font-weight: 800; margin-top: 4px; text-shadow: 0 0 15px var(--glow); }
        .balance-pill { background: var(--card); border: 1px solid var(--border); padding: 8px 15px; border-radius: 12px; display: flex; align-items: center; gap: 8px; backdrop-filter: blur(10px); cursor: pointer; }

        /* Chips */
        .chips-container { display: flex; gap: 12px; overflow-x: auto; padding: 5px 0 20px; scrollbar-width: none; }
        .chip { padding: 10px 20px; border-radius: 12px; background: var(--card); border: 1px solid var(--border); color: var(--text-dim); font-weight: 700; transition: 0.3s; cursor: pointer; white-space: nowrap; }
        .chip.active { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 0 15px var(--glow); }

        /* Tournament Card */
        .tournament-card { background: linear-gradient(145deg, #1a0b2e, #0a0514); border: 1px solid var(--border); border-radius: 20px; margin-bottom: 25px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .banner-header { height: 140px; position: relative; background: #000; }
        .banner-header img { width: 100%; height: 100%; object-fit: cover; opacity: 0.6; }
        .game-title { position: absolute; top: 20px; left: 20px; font-family: 'Orbitron'; font-size: 24px; font-weight: 900; color: #fff; }
        .entry-fee-badge { position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.8); border: 1px solid var(--cyan); padding: 5px 12px; border-radius: 8px; color: var(--cyan); font-family: 'Orbitron'; font-size: 12px; }

        .match-info-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 15px; background: rgba(255,255,255,0.03); margin: 0 15px; border-radius: 12px; }
        .info-box { text-align: center; border-right: 1px solid var(--border); }
        .info-box:last-child { border-right: none; }
        .info-val { display: block; font-weight: 700; font-size: 14px; }
        .info-label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; }

        .slot-progress-area { padding: 15px 20px 10px; }
        .progress-bar-bg { height: 10px; background: #12081e; border-radius: 20px; margin-bottom: 8px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--cyan)); transition: 0.5s; }
        .slot-text { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--text-dim); }

        /* Match Day Section */
        .match-day-row { margin-top: 12px; text-align: center; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: center; gap: 15px; }
        .match-day-row span { font-size: 12px; color: var(--cyan); font-family: 'Orbitron'; font-weight: 700; display: flex; align-items: center; gap: 6px; }

        .card-footer { padding: 0 20px 20px; display: flex; justify-content: space-between; align-items: center; }
        .join-btn { background: linear-gradient(90deg, #8c00ff, #00e5ff); border: none; padding: 10px 20px; border-radius: 10px; color: #fff; font-weight: 800; font-family: 'Orbitron'; cursor: pointer; font-size: 12px; }
        .join-btn.joined { background: var(--success); }
        .join-btn.full { background: #333; cursor: not-allowed; }

        /* Navigation */
        .tab-bar { position: fixed; bottom: 20px; left: 15px; right: 15px; height: 80px; background: rgba(18, 8, 30, 0.95); border: 1px solid var(--border); border-radius: 25px; display: flex; justify-content: space-around; align-items: center; backdrop-filter: blur(20px); z-index: 1000; }
        .tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-dim); text-decoration: none; }
        .tab-item.active { color: var(--cyan); }
        .tab-item i { font-size: 20px; }
        .tab-item span { font-size: 9px; font-weight: 700; text-transform: uppercase; }
        .center-wallet { transform: translateY(-10px); }
        .center-wallet i { font-size: 28px; color: var(--cyan); background: var(--bg); padding: 12px; border-radius: 50%; border: 2px solid var(--cyan); }

        /* Broadcast Update Modal Styles */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(2, 0, 10, 0.95); display: none; align-items: center; justify-content: center; z-index: 99999; backdrop-filter: blur(12px); }
        .custom-popup { width: 88%; max-width: 350px; background: linear-gradient(145deg, #160a2d, #05010a); border-radius: 30px; text-align: center; overflow: hidden; border: 1px solid var(--border); box-shadow: 0 25px 60px rgba(0,0,0,0.9); animation: premiumPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes premiumPop { from { transform: scale(0.6) translateY(50px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }
        .popup-content { padding: 35px 25px; }
        .popup-icon-wrapper { width: 65px; height: 65px; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: rgba(0, 229, 255, 0.05); border: 1px solid rgba(0, 229, 255, 0.2); }
        .popup-title { font-family: 'Orbitron'; font-size: 16px; font-weight: 700; margin-bottom: 12px; color: var(--cyan); letter-spacing: 1px; text-transform: uppercase; }
        .popup-text { font-size: 14px; color: var(--text-dim); line-height: 1.5; text-align: left; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 12px; border: 1px solid #1c103a; white-space: pre-line; }
        .popup-btn { width: 100%; padding: 18px; background: linear-gradient(90deg, var(--accent), var(--cyan)); border: none; color: #fff; font-family: 'Orbitron'; font-weight: 700; font-size: 14px; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; transition: 0.3s; }
        .popup-btn:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <div class="modal-overlay" id="broadcastModalOverlay">
        <div class="custom-popup">
            <div class="popup-content">
                <div class="popup-icon-wrapper">
                    <i class="fa-solid fa-cloud-arrow-down" style="font-size: 26px; color: var(--cyan);"></i>
                </div>
                <h3 id="broadcastTitle" class="popup-title">App Update Available</h3>
                <p id="broadcastText" class="popup-text">Loading modification patch logs...</p>
            </div>
            <button class="popup-btn" id="broadcastCloseBtn">Update Now</button>
        </div>
    </div>

    <div class="safe-area">
        <div class="header">
            <div class="welcome-section">
                <div class="hello">Ready to Battle</div>
                <div class="name" id="userName">Warrior</div>
            </div>
            <div class="balance-pill" onclick="location.href='wallet.html'">
                <i class="fa-solid fa-wallet" style="color: var(--cyan);"></i>
                <span class="balance-text" id="userBalance">₹0</span>
            </div>
        </div>

        <div class="chips-container">
            <div class="chip active">All Arena</div>
            <div class="chip">1v1</div>
            <div class="chip">Solo</div>
            <div class="chip">Duo</div>
            <div class="chip">Squad</div>
            <div class="chip">LW</div>
            <div class="chip">1v1(head)</div>
            <div class="chip">Free</div>
        </div>

        <div id="tournamentArena">
            <div style="text-align: center; padding: 50px; opacity: 0.5;">SCANNING...</div>
        </div>
    </div>

    <nav class="tab-bar">
        <a href="home.html" class="tab-item active"><i class="fa-solid fa-gamepad"></i><span>Arena</span></a>
        <a href="match.html" class="tab-item"><i class="fa-solid fa-trophy"></i><span>Matches</span></a>
        <a href="wallet.html" class="tab-item center-wallet"><i class="fa-solid fa-circle-dollar-to-slot"></i><span>Wallet</span></a>
                <a href="redeem-code.html" class="tab-item"><i class="fa-solid fa-gift"></i><span>Redeem Code</span></a>
        <a href="profile.html" class="tab-item"><i class="fa-solid fa-user-gear"></i><span>Profile</span></a>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, query, where, onSnapshot, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC5P3d9xk3XBrKTZw7aQFE2DhfOYsLsG_4",
            authDomain: "binary-battle-6917a.firebaseapp.com",
            projectId: "binary-battle-6917a",
            storageBucket: "binary-battle-6917a.firebasestorage.app",
            messagingSenderId: "411576208",
            appId: "1:411576208:web:1acb62c098fbdb550e7515"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let userJoinedMatches = [];
        let currentFilter = "All Arena";

        // Notification Stream Listener (Resets when logging out, closing app or coming back fresh)
        function listenForGlobalUpdates() {
            const updateCollection = collection(db, "update");
            const structuralQuery = query(updateCollection, orderBy("timestamp", "desc"), limit(1));

            onSnapshot(structuralQuery, (snapshot) => {
                if (!snapshot.empty) {
                    snapshot.forEach((doc) => {
                        const updateData = doc.data();
                        
                        // Uses sessionStorage to verify user interaction boundaries within the active application runtime
                        const sessionClosedId = sessionStorage.getItem("closedUpdateId");

                        if (sessionClosedId !== doc.id) {
                            document.getElementById("broadcastTitle").innerText = updateData.title;
                            document.getElementById("broadcastText").innerText = updateData.message;
                            document.getElementById("broadcastModalOverlay").style.display = "flex";

                            document.getElementById("broadcastCloseBtn").onclick = function() {
                                sessionStorage.setItem("closedUpdateId", doc.id);
                                document.getElementById("broadcastModalOverlay").style.display = "none";
                                window.location.href = "https://yourupdateurl.com"; // Set your target redirection update link here
                            };
                        }
                    });
                }
            });
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userSnap = await getDoc(doc(db, "users", user.uid));
                if (userSnap.exists()) {
                    document.getElementById("userName").innerText = userSnap.data().name || "Warrior";
                    document.getElementById("userBalance").innerText = "₹" + (userSnap.data().wallet_balance || 0);
                }

                onSnapshot(collection(db, "users", user.uid, "joined_matches"), (snapshot) => {
                    userJoinedMatches = snapshot.docs.map(doc => doc.id);
                    fetchTournaments(currentFilter);
                });

                // Fire validation stream on auth initiation
                listenForGlobalUpdates();

            } else {
                window.location.href = "home.html";
            }
        });

        const arena = document.getElementById('tournamentArena');

        function renderMatches(docs) {
            arena.innerHTML = '';
            if (docs.length === 0) {
                arena.innerHTML = `<div style="text-align:center; padding:50px; opacity:0.5;"><h3>NO LIVE BATTLES</h3></div>`;
                return;
            }

            docs.forEach(d => {
                const data = d.data();
                const matchId = d.id;
                const joined = data.joined_players || 0;
                const total = data.total_slots || 48;
                const isFull = joined >= total;
                const isJoined = userJoinedMatches.includes(matchId);
                const progress = (joined / total) * 100;

                const matchType = (data.match_type || "solo").toLowerCase();
                
                let slotPage = "soloslot.html"; 
                if (matchType === "squad") { slotPage = "squadeslot.html"; }
                else if (matchType === "duo") { slotPage = "duoslot.html"; }
                else if (matchType === "1v1" || matchType === "1v1(head)") { slotPage = "1v1slot.html"; }
                else if (matchType === "lw") { slotPage = "lwslot.html"; }
                else if (matchType === "free") { slotPage = "soloslot.html"; }

                let btnLabel = "JOIN NOW";
                let btnClass = "";
                let btnUrl = `${slotPage}?matchId=${matchId}`;
                let cardUrl = `details.html?matchId=${matchId}`;

                if (isJoined) {
                    btnLabel = "JOINED";
                    btnClass = "joined";
                    btnUrl = `banner.html?matchId=${matchId}`;
                    cardUrl = btnUrl; 
                } else if (isFull) {
                    btnLabel = "MATCH FULL";
                    btnClass = "full";
                    btnUrl = "#"; 
                    cardUrl = `details.html?matchId=${matchId}`; 
                }

                arena.innerHTML += `
                    <div class="tournament-card" onclick="if('${cardUrl}' !== '#') location.href='${cardUrl}'">
                        <div class="banner-header">
                            <img src="${data.image_url || 'banner.png'}" alt="Match">
                            <div class="game-title">${data.game_name || 'FREE FIRE'}</div>
                            <div class="entry-fee-badge">FEE: ₹${data.entry_fee || 0}</div>
                        </div>
                        <div class="match-info-grid">
                            <div class="info-box"><span class="info-val">₹${data.prize_pool}</span><span class="info-label">Prize Pool</span></div>
                            <div class="info-box"><span class="info-val">₹${data.entry_fee || 0}</span><span class="info-label">Entry Fee</span></div>
                            <div class="info-box"><span class="info-val">₹${data.per_kill || 0}</span><span class="info-label">Per Kill</span></div>
                        </div>
                        <div class="slot-progress-area">
                            <div class="progress-bar-bg"><div class="progress-fill" style="width: ${progress}%"></div></div>
                            <div class="slot-text">Slots Filled: <span>${joined}/${total}</span></div>
                            
                            <div class="match-day-row">
                                 <span><i class="fa-regular fa-calendar-days"></i> ${data.match_date}</span>
                                 <span><i class="fa-solid fa-shield-halved"></i> ${matchType.toUpperCase()}</span>
                            </div>
                        </div>
                        <div class="card-footer">
                            <div style="font-size:12px; color:var(--text-dim)">By <span style="color:var(--accent)">Binary Battle</span></div>
                            <button class="join-btn ${btnClass}" 
                                onclick="event.stopPropagation(); if('${btnUrl}' !== '#') location.href='${btnUrl}'">
                                ${btnLabel}
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        function fetchTournaments(filterType) {
            currentFilter = filterType;
            let q = query(collection(db, "tournaments"), where("status", "==", "scheduled"));
            
            if (filterType !== "All Arena") {
                q = query(collection(db, "tournaments"), 
                    where("status", "==", "scheduled"), 
                    where("match_type", "==", filterType.toLowerCase()));
            }

            onSnapshot(q, (snapshot) => {
                renderMatches(snapshot.docs);
            });
        }

        document.querySelectorAll('.chip').forEach(chip => {
            chip.addEventListener('click', (e) => {
                document.querySelector('.chip.active').classList.remove('active');
                e.target.classList.add('active');
                fetchTournaments(e.target.innerText);
            });
        });
    </script>
</body>
</html>
