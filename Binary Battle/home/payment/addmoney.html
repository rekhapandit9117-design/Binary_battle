<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Add Funds | Binary Battle</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    
    <!-- ZapUPI Web Kit -->
    <script src="https://zapupi.com/single-html-web-kit.js"></script>
    
    <style>
        :root { --bg: #05010a; --card: rgba(25, 10, 50, 0.8); --accent: #8c00ff; --cyan: #00e5ff; --border: #2d1b4d; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rajdhani', sans-serif; }
        body { background: var(--bg); color: #fff; min-height: 100vh; background-image: radial-gradient(circle at 50% -20%, #2d1b4d 0%, transparent 60%); }
        .header { padding: 30px 20px 20px; display: flex; align-items: center; gap: 15px; }
        .back-btn { width: 40px; height: 40px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--cyan); text-decoration: none; transition: 0.2s; }
        .back-btn:active { transform: scale(0.95); }
        .container { padding: 0 20px; max-width: 500px; margin: 0 auto; }
        .balance-pill { background: rgba(140, 0, 255, 0.1); border: 1px solid var(--accent); padding: 15px; border-radius: 20px; text-align: center; margin-bottom: 30px; }
        .input-card { background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 25px; margin-bottom: 20px; backdrop-filter: blur(10px); }
        #amountInput { width: 100%; background: rgba(0,0,0,0.3); border: 2px solid var(--border); padding: 20px; border-radius: 16px; color: #fff; font-family: 'Orbitron'; font-size: 28px; text-align: center; outline: none; margin-bottom: 20px;}
        .amount-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .chip { background: rgba(255,255,255,0.05); border: 1px solid var(--border); padding: 15px 10px; border-radius: 12px; text-align: center; font-family: 'Orbitron'; font-size: 16px; cursor: pointer; transition: 0.2s; }
        .chip.active { background: var(--accent); border-color: var(--cyan); box-shadow: 0 0 15px var(--accent); }
        .pay-btn { width: 100%; padding: 20px; background: linear-gradient(90deg, var(--accent), var(--cyan)); border: none; border-radius: 18px; color: #fff; font-family: 'Orbitron'; font-weight: 800; cursor: pointer; text-transform: uppercase; transition: 0.2s; }
        .pay-btn:disabled { opacity: 0.4; cursor: not-allowed; background: #333; }
        #loader { position: fixed; inset: 0; background: rgba(5, 1, 10, 0.9); z-index: 9999; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 15px;}
    </style>
</head>
<body>

    <div id="loader">
        <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 50px; color: var(--cyan);"></i>
        <p id="loaderText" style="font-family: 'Orbitron'; color: var(--cyan);">Initializing Secure Gateway...</p>
    </div>

    <header class="header">
        <a href="../wallet.html" class="back-btn"><i class="fa-solid fa-chevron-left"></i></a>
        <h1 style="font-family: 'Orbitron'; font-size: 18px;">Add Money</h1>
    </header>

    <div class="container">
        <div class="balance-pill">
            <p style="font-size: 11px; opacity: 0.7; font-weight: bold; letter-spacing: 1px;">WALLET BALANCE</p>
            <h2 style="font-family: 'Orbitron'; margin-top: 8px;">₹<span id="currentWalletBalance">0.00</span></h2>
        </div>

        <div class="input-card">
            <input type="number" id="amountInput" placeholder="₹ 0" readonly>
            <div class="amount-grid">
                <div class="chip" onclick="setAmount(10)">10</div>
                <div class="chip" onclick="setAmount(50)">50</div>
                <div class="chip" onclick="setAmount(100)">100</div>
                <div class="chip" onclick="setAmount(200)">200</div>
                <div class="chip" onclick="setAmount(300)">300</div>
                <div class="chip" onclick="setAmount(500)">500</div>
            </div>
        </div>
        <button class="pay-btn" id="payBtn" disabled onclick="initiatePayment()">Select Amount to Pay</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        // Imports now include addDoc, collection, and serverTimestamp for history
        import { getFirestore, doc, onSnapshot, updateDoc, increment, addDoc, collection, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC5P3d9xk3XBrKTZw7aQFE2DhfOYsLsG_4",
            authDomain: "binary-battle-6917a.firebaseapp.com",
            projectId: "binary-battle-6917a",
            storageBucket: "binary-battle-6917a.firebasestorage.app",
            messagingSenderId: "411576208",
            appId: "1:411576208:web:1acb62c098fbdb550e7515",
            measurementId: "G-QHKKXN93P6"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        let selectedAmount = 0;
        const loader = document.getElementById('loader');
        const loaderText = document.getElementById('loaderText');
        const payBtn = document.getElementById('payBtn');

        // Real-time listener for current balance
        onAuthStateChanged(auth, (user) => {
            if (user) {
                onSnapshot(doc(db, "users", user.uid), (snap) => {
                    if (snap.exists()) {
                        const balance = snap.data().wallet_balance || 0;
                        document.getElementById('currentWalletBalance').innerText = parseFloat(balance).toFixed(2);
                    }
                });
            } else { 
                window.location.href = "../../login.html"; 
            }
        });

        // Set up ZapUPI Global Callbacks
        ZapUPI.setPaymentCallbacks({
            onSuccess: async function(orderId) {
                const user = auth.currentUser;
                if (user) {
                    loader.style.display = 'flex';
                    loaderText.innerText = 'Updating Wallet & Recording Transaction...';
                    
                    try {
                        // 1. Update wallet balance
                        const userRef = doc(db, "users", user.uid);
                        await updateDoc(userRef, {
                            wallet_balance: increment(selectedAmount)
                        });

                        // 2. Add transaction entry to Firestore so wallet.html can show it
                        await addDoc(collection(db, "transactions"), {
                            userId: user.uid,
                            amount: selectedAmount,
                            type: "DEPOSIT",
                            status: "SUCCESS",
                            orderId: orderId,
                            createdAt: serverTimestamp()
                        });
                        
                        alert("Payment Successful! ₹" + selectedAmount + " added to your wallet.");
                        window.location.href = "../wallet.html";
                    } catch (error) {
                        console.error("Error updating wallet: ", error);
                        alert("Payment successful but failed to record on database. Please contact support. Order: " + orderId);
                        window.location.href = "../wallet.html";
                    }
                }
            },
            onFailed: function(orderId) {
                loader.style.display = 'none';
                payBtn.disabled = false;
                alert("Payment Failed or Cancelled. Order: " + orderId);
            },
            onTimeout: function(orderId) {
                loader.style.display = 'none';
                payBtn.disabled = false;
                alert("Payment Session Timed Out. Order: " + orderId);
            }
        });

        window.setAmount = function(amt) {
            selectedAmount = Number(amt);
            document.getElementById('amountInput').value = amt;
            
            document.querySelectorAll('.chip').forEach(c => {
                c.classList.toggle('active', Number(c.innerText) === amt);
            });
            
            payBtn.disabled = false;
            payBtn.innerText = `Pay ₹${amt} & Proceed`;
        };

        window.initiatePayment = function() {
            const user = auth.currentUser;
            if(!user) return alert("Session expired, please log in again!");
            if(selectedAmount <= 0) return alert("Please select an amount.");

            payBtn.disabled = true;
            loader.style.display = 'flex';
            loaderText.innerText = 'Creating Secure Order...';

            ZapUPI.createOrder(
                {
                    zap_key:  "zap76efd87baf2f2a4c8f3a89d86254405f", 
                    order_id: "ORD" + Date.now(), 
                    amount:   selectedAmount.toString(), 
                    customer_mobile: user.phoneNumber || "9999999999", 
                    remark: "Add Funds | " + user.uid
                },
                {
                    onResponse: function(paymentUrl, orderId, data) {
                        loaderText.innerText = 'Opening Payment Gateway...';
                        ZapUPI.loadPayment(paymentUrl);
                    },
                    onError: function(err) {
                        loader.style.display = 'none';
                        payBtn.disabled = false;
                        alert("Order Error: " + err);
                    }
                }
            );
        };
    </script>
</body>
</html>
