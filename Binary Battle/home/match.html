<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Matches | Binary Battle</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #05010a;
            --card: rgba(18, 8, 30, 0.6);
            --accent: #8c00ff;
            --cyan: #00e5ff;
            --text-dim: #a5a5a5;
            --border: #2d1b4d;
            --glow: rgba(140, 0, 255, 0.3);
            --live: #ff0055;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Rajdhani', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at 10% 10%, rgba(140, 0, 255, 0.08) 0%, transparent 40%);
            color: #fff; min-height: 100vh;
        }

        .safe-area { padding: 30px 20px 120px; max-width: 600px; margin: 0 auto; }

        /* Header */
        .header { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; }
        .back-btn { 
            background: var(--card); border: 1px solid var(--border); 
            width: 40px; height: 40px; border-radius: 10px; 
            display: flex; align-items: center; justify-content: center; color: var(--cyan);
        }
        .page-title { font-family: 'Orbitron'; font-size: 22px; letter-spacing: 1px; }

        /* Tabs */
        .status-toggle { display: flex; gap: 10px; margin-bottom: 25px; }
        .status-chip { 
            flex: 1; text-align: center; padding: 12px; border-radius: 12px; 
            background: var(--card); border: 1px solid var(--border); 
            color: var(--text-dim); font-weight: 700; transition: 0.3s; cursor: pointer;
        }
        .status-chip.active { 
            background: var(--accent); color: #fff; border-color: var(--accent); 
            box-shadow: 0 0 15px var(--glow); 
        }

        /* Match Cards */
        .match-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 15px; padding: 15px; margin-bottom: 15px;
            display: flex; flex-direction: column; gap: 10px; transition: 0.3s;
        }
        .match-top { display: flex; justify-content: space-between; align-items: center; }
        .game-tag { color: var(--cyan); font-weight: 700; font-size: 14px; text-transform: uppercase; }
        
        .status-label { font-size: 10px; padding: 4px 8px; border-radius: 5px; font-weight: 800; }
        .label-live { background: var(--live); color: white; animation: pulse 1.5s infinite; }
        .label-scheduled { background: #333; color: var(--cyan); }
        .label-completed { background: #1a1a1a; color: #666; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        .match-details { display: flex; justify-content: space-between; align-items: flex-end; }
        .match-date { font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
        .prize-text { font-weight: 700; color: #fff; font-size: 16px; }
        
        .view-btn { 
            background: transparent; border: 1px solid var(--cyan); 
            color: var(--cyan); padding: 8px 18px; border-radius: 10px; 
            font-size: 12px; font-weight: 700; cursor: pointer; transition: 0.2s;
        }
        .view-btn.live-btn {
            background: var(--live); border: none; color: white;
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.4);
        }

        /* Nav Bar */
        .tab-bar { 
            position: fixed; bottom: 20px; left: 15px; right: 15px; 
            height: 90px; background: rgba(18, 8, 30, 0.95); 
            border: 1px solid var(--border); border-radius: 30px; 
            display: flex; justify-content: space-around; align-items: center; 
            backdrop-filter: blur(20px); z-index: 1000;
        }
        .tab-item { 
            flex: 1; display: flex; flex-direction: column; 
            align-items: center; gap: 6px; color: var(--text-dim); 
            text-decoration: none; transition: 0.3s;
        }
        .tab-item i { font-size: 22px; }
        .tab-item span { font-size: 10px; font-weight: 700; text-transform: uppercase; }
        .tab-item.active:not(.center-wallet) { color: var(--cyan); }
        .tab-item.center-wallet i {
            font-size: 32px; color: var(--cyan); background: var(--bg);
            padding: 15px; border-radius: 50%; border: 2px solid var(--cyan);
            transform: translateY(-15px); box-shadow: 0 0 20px var(--glow);
        }
    </style>
</head>
<body>

    <div class="safe-area">
        <div class="header">
            <button class="back-btn" onclick="history.back()"><i class="fa-solid fa-chevron-left"></i></button>
            <div class="page-title">MY MATCHES</div>
        </div>

        <div class="status-toggle">
            <div class="status-chip active" onclick="setFilter('ongoing', this)">ONGOING</div>
            <div class="status-chip" onclick="setFilter('completed', this)">RESULTS</div>
        </div>

        <div id="matchContainer">
            <div style="text-align:center; padding:50px; opacity:0.3;">
                <i class="fa-solid fa-satellite-dish fa-spin" style="font-size:30px; margin-bottom:10px;"></i>
                <p>LOADING BATTLES...</p>
            </div>
        </div>
    </div>

    <nav class="tab-bar">
        <a href="home.html" class="tab-item"><i class="fa-solid fa-gamepad"></i><span>Arena</span></a>
        <a href="match.html" class="tab-item active"><i class="fa-solid fa-trophy"></i><span>Matches</span></a>
        <a href="wallet.html" class="tab-item center-wallet"><i class="fa-solid fa-circle-dollar-to-slot"></i><span>Wallet</span></a>
        <a href="redeem-code.html" class="tab-item"><i class="fa-solid fa-gift"></i><span>Redeem Code</span></a>
        <a href="profile.html" class="tab-item"><i class="fa-solid fa-user-gear"></i><span>Profile</span></a>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC5P3d9xk3XBrKTZw7aQFE2DhfOYsLsG_4",
            authDomain: "binary-battle-6917a.firebaseapp.com",
            projectId: "binary-battle-6917a",
            storageBucket: "binary-battle-6917a.firebasestorage.app",
            messagingSenderId: "411576208",
            appId: "1:411576208:web:1acb62c098fbdb550e7515"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const container = document.getElementById('matchContainer');

        let currentFilter = 'ongoing';
        let allMatches = [];

        onSnapshot(query(collection(db, "tournaments"), orderBy("created_at", "desc")), (snapshot) => {
            allMatches = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderMatches();
        });

        function renderMatches() {
            container.innerHTML = '';
            
            const filtered = allMatches.filter(m => {
                if (currentFilter === 'ongoing') return m.status === 'live' || m.status === 'scheduled';
                return m.status === 'completed';
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:50px; color:var(--text-dim);">NO MATCHES FOUND</div>`;
                return;
            }

            filtered.forEach(data => {
                const isLive = data.status === 'live';
                const statusClass = isLive ? 'label-live' : (data.status === 'completed' ? 'label-completed' : 'label-scheduled');
                const statusText = isLive ? 'LIVE NOW' : data.status.toUpperCase();

                // REDIRECTION LOGIC
                // Live or Scheduled matches go to tournament-details.html
                // Completed matches go to completed-matchdetails.html (if implemented, else same page) 
                const targetPage = (data.status === 'live' || data.status === 'scheduled') 
                    ? `tournament-details.html?id=${data.id}` 
                    : `completed-matchdetails.html?id=${data.id}`;

                container.innerHTML += `
                    <div class="match-card" style="${isLive ? 'border-color: var(--live);' : ''}">
                        <div class="match-top">
                            <span class="game-tag">${data.game_name}</span>
                            <span class="status-label ${statusClass}">${statusText}</span>
                        </div>
                        <div class="match-details">
                            <div>
                                <div class="match-date"><i class="fa-regular fa-calendar"></i> ${data.match_date}</div>
                                <div class="prize-text">Prize: ₹${data.prize_pool}</div>
                            </div>
                            <button class="view-btn ${isLive ? 'live-btn' : ''}" 
                                    onclick="location.href='${targetPage}'">
                                ${isLive ? 'WATCH LIVE' : 'DETAILS'}
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        window.setFilter = (filter, el) => {
            currentFilter = filter;
            document.querySelectorAll('.status-chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            renderMatches();
        };
    </script>
</body>
</html>
