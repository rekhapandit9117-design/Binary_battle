<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match Report | Binary Battle</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05010a;
            --panel: rgba(15, 10, 35, 0.85);
            --accent: #8c00ff;
            --cyan: #00e5ff;
            --gold: #ffb800;
            --text-dim: #a5a5a5;
            --border: rgba(140, 0, 255, 0.3);
            --success: #00ff88;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rajdhani', sans-serif; }
        body { 
            background: var(--bg); 
            color: #fff; 
            min-height: 100vh;
            background-image: radial-gradient(circle at 50% -20%, #2d1b4d, transparent);
        }

        .top-nav {
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .back-btn {
            width: 40px; height: 40px; background: var(--panel); border: 1px solid var(--border);
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            color: #fff; text-decoration: none;
        }

        .container { max-width: 600px; margin: 0 auto; padding: 20px; }

        .result-header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeIn 0.8s ease;
        }
        .match-id-badge {
            display: inline-block;
            padding: 5px 15px;
            background: rgba(140, 0, 255, 0.2);
            border: 1px solid var(--accent);
            border-radius: 20px;
            font-family: 'Orbitron';
            font-size: 10px;
            letter-spacing: 1px;
            color: var(--cyan);
            margin-bottom: 10px;
        }

        .podium {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 40px;
        }

        .player-card.winner {
            width: 100%;
            background: var(--panel);
            border-radius: 30px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border: 2px solid var(--gold);
            background: linear-gradient(135deg, rgba(255, 184, 0, 0.1), var(--panel));
            box-shadow: 0 15px 40px rgba(255, 184, 0, 0.1);
            position: relative;
        }

        .avatar-wrap { position: relative; margin-bottom: 15px; }
        .avatar {
            width: 100px; height: 100px;
            border-radius: 25px;
            background: #1a152e;
            display: flex; align-items: center; justify-content: center;
            font-size: 45px;
            border: 3px solid var(--gold);
        }
        
        .crown-icon {
            position: absolute;
            top: -20px; left: 50%;
            transform: translateX(-50%);
            color: var(--gold);
            font-size: 32px;
            filter: drop-shadow(0 0 15px var(--gold));
        }

        .player-info h4 { font-family: 'Orbitron'; font-size: 14px; color: var(--gold); letter-spacing: 2px; margin-bottom: 5px; }
        .player-info h2 { font-size: 32px; font-weight: 700; color: #fff; letter-spacing: 1px; margin-bottom: 15px; }

        .prize-tag {
            background: rgba(0, 0, 0, 0.3);
            padding: 10px 25px;
            border-radius: 15px;
            border: 1px solid rgba(255, 184, 0, 0.3);
        }
        .prize-amount { font-family: 'Orbitron'; color: var(--gold); font-size: 26px; font-weight: 700; }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }
        .stat-item {
            background: var(--panel);
            padding: 20px;
            border-radius: 20px;
            border: 1px solid var(--border);
            text-align: center;
        }
        .stat-item i { color: var(--accent); margin-bottom: 10px; font-size: 20px; }
        .stat-item span { display: block; font-size: 12px; color: var(--text-dim); text-transform: uppercase; margin-bottom: 5px; }
        .stat-item b { font-family: 'Orbitron'; font-size: 16px; color: #fff; }

        .verification-note {
            text-align: center;
            padding: 20px;
            color: var(--text-dim);
            font-size: 13px;
            border-top: 1px solid var(--border);
            margin-top: 20px;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(100%); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <nav class="top-nav">
        <a href="javascript:history.back()" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
        <div style="font-family: 'Orbitron'; font-size: 16px; font-weight: 700; color: var(--cyan);">MATCH REPORT</div>
        <div style="width: 40px;"></div>
    </nav>

    <div class="container">
        <div class="result-header">
            <span class="match-id-badge" id="matchIdDisp">ID: BB-LOADING</span>
            <h1 style="font-family: 'Orbitron'; font-size: 22px; color: #fff;">VICTORY ACHIEVED</h1>
        </div>

        <div class="podium">
            <div class="player-card winner">
                <div class="avatar-wrap">
                    <i class="fa-solid fa-crown crown-icon"></i>
                    <div class="avatar"><i class="fa-solid fa-user-ninja" style="color: var(--gold);"></i></div>
                </div>
                <div class="player-info">
                    <h4>CHAMPION</h4>
                    <h2 id="winnerName">----</h2>
                </div>
                <div class="prize-tag">
                    <span style="font-size: 11px; color: var(--text-dim); display: block; margin-bottom: 2px;">TOTAL WINNINGS</span>
                    <div class="prize-amount">₹<span id="prizeVal">0</span></div>
                </div>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-item">
                <i class="fa-solid fa-bolt"></i>
                <span>GAME MODE</span>
                <b id="matchMode">BATTLE</b>
            </div>
            <div class="stat-item">
                <i class="fa-solid fa-calendar-check"></i>
                <span>RESULT</span>
                <b style="color: var(--success);">VERIFIED</b>
            </div>
        </div>

        <div class="verification-note">
            <i class="fa-solid fa-shield-halved" style="margin-right: 5px; color: var(--cyan);"></i> 
            This match is officially verified by the Binary Battle Security Protocol.
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC5P3d9xk3XBrKTZw7aQFE2DhfOYsLsG_4",
            authDomain: "binary-battle-6917a.firebaseapp.com",
            projectId: "binary-battle-6917a",
            storageBucket: "binary-battle-6917a.firebasestorage.app",
            messagingSenderId: "411576208",
            appId: "1:411576208:web:1acb62c098fbdb550e7515",
            measurementId: "G-QHKKXN93P6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function loadMatchDetails() {
            const urlParams = new URLSearchParams(window.location.search);
            const mid = urlParams.get('id');

            if (!mid) return;
            document.getElementById('matchIdDisp').innerText = `ID: ${mid.substring(0, 8).toUpperCase()}`;

            try {
                const docSnap = await getDoc(doc(db, "completed_matches", mid));
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    
                    // Logic: Show winner_name if it exists, otherwise show winner_email as backup
                    document.getElementById('winnerName').innerText = data.winner_name || data.winner_email || "N/A";
                    
                    document.getElementById('prizeVal').innerText = data.prize_pool || "0";
                    document.getElementById('matchMode').innerText = (data.mode || "BATTLE").toUpperCase();
                }
            } catch (error) {
                console.error("Error loading match:", error);
            }
        }

        loadMatchDetails();
    </script>
</body>
</html>
