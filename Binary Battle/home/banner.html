<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Match Center | Binary Battle</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #05010a;
            --card: rgba(25, 10, 45, 0.6);
            --accent: #8c00ff;
            --cyan: #00e5ff;
            --text-dim: #a5a5a5;
            --border: #2d1b4d;
            --glow: rgba(0, 229, 255, 0.2);
            --glass: rgba(255, 255, 255, 0.03);
            --success: #00ff88;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rajdhani', sans-serif; }
        
        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 0%, rgba(140, 0, 255, 0.15) 0%, transparent 50%);
            color: #fff; min-height: 100vh; padding-bottom: 120px;
        }

        .container { padding: 20px; max-width: 500px; margin: 0 auto; }

        .top-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .back-btn {
            width: 40px; height: 40px; border-radius: 12px; background: var(--card);
            border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
            color: #fff; text-decoration: none; font-size: 18px;
        }

        .details-card {
            background: var(--card); border: 1px solid var(--border); border-radius: 24px;
            overflow: hidden; backdrop-filter: blur(10px); margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .hero-img { width: 100%; height: 200px; object-fit: cover; border-bottom: 1px solid var(--border); }
        .card-body { padding: 20px; }

        .game-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
        .game-name { font-family: 'Orbitron'; font-size: 22px; color: #fff; text-transform: uppercase; letter-spacing: 1px; }
        .match-type { background: var(--accent); padding: 4px 12px; border-radius: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; }

        .timer-box {
            background: rgba(140, 0, 255, 0.1); border: 1px solid var(--accent);
            border-radius: 15px; padding: 15px; text-align: center; margin-bottom: 20px;
        }
        .timer-label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; display: block; margin-bottom: 5px; }
        #countdown { font-family: 'Orbitron'; font-size: 24px; color: var(--cyan); letter-spacing: 2px; text-shadow: 0 0 10px var(--glow); }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .stat-item { background: var(--glass); border: 1px solid var(--border); padding: 12px; border-radius: 15px; text-align: center; }
        .stat-val { font-family: 'Orbitron'; color: var(--cyan); font-size: 18px; display: block; }

        .creds-container {
            background: rgba(0, 229, 255, 0.08); border: 1px dashed var(--cyan);
            border-radius: 15px; padding: 18px; margin-top: 10px; display: none;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.1);
        }
        .cred-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 15px; }
        .cred-key { color: var(--text-dim); text-transform: uppercase; }
        .cred-val { color: var(--cyan); font-family: 'Orbitron'; font-weight: 700; }

        .section-title { font-family: 'Orbitron'; font-size: 14px; color: var(--cyan); margin: 25px 0 15px; display: flex; align-items: center; gap: 10px; }
        .player-card {
            background: var(--glass); border-left: 4px solid var(--accent);
            padding: 14px 18px; border-radius: 10px; margin-bottom: 10px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .p-name { font-weight: 700; letter-spacing: 0.5px; }
        .p-status { font-size: 10px; color: var(--success); text-transform: uppercase; font-weight: 800; }
        .slot-num { font-size: 10px; color: var(--cyan); font-family: 'Orbitron'; margin-right: 5px; opacity: 0.8; }

        .footer { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 450px; }
        .copy-btn {
            width: 100%; background: linear-gradient(90deg, var(--accent), var(--cyan));
            border: none; padding: 18px; border-radius: 16px; color: #fff;
            font-family: 'Orbitron'; font-weight: 800; font-size: 15px; cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            transition: 0.3s;
        }
        .copy-btn:disabled { background: #222; color: #555; cursor: not-allowed; box-shadow: none; }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-nav">
            <div style="display: flex; align-items: center; gap: 15px;">
                <a href="home.html" class="back-btn"><i class="fa-solid fa-chevron-left"></i></a>
                <div class="nav-title" style="font-family: 'Orbitron'; font-size: 16px;">MATCH CENTER</div>
            </div>
        </div>

        <div class="details-card">
            <img src="banner.png" id="matchBanner" class="hero-img" alt="Banner">
            <div class="card-body">
                <div class="game-header">
                    <div>
                        <div class="game-name" id="gameName">LOADING...</div>
                        <div style="color: var(--text-dim); font-size: 14px; margin-top: 4px;" id="matchDate">---</div>
                    </div>
                    <span class="match-type" id="matchType">---</span>
                </div>

                <div class="timer-box">
                    <span class="timer-label">Tournament Starting In</span>
                    <div id="countdown">00h 00m 00s</div>
                </div>

                <div class="stats-grid">
                    <div class="stat-item">
                        <span class="timer-label">Prize Pool</span>
                        <span class="stat-val" id="prizePool">₹0</span>
                    </div>
                    <div class="stat-item">
                        <span class="timer-label">Status</span>
                        <span class="stat-val" id="matchStatus" style="font-size: 14px;">---</span>
                    </div>
                </div>

                <div id="credsBox" class="creds-container">
                    <div class="cred-row">
                        <span class="cred-key">Room ID</span>
                        <span class="cred-val" id="roomId">---</span>
                    </div>
                    <div class="cred-row">
                        <span class="cred-key">Password</span>
                        <span class="cred-val" id="roomPass">---</span>
                    </div>
                </div>

                <div id="waitMsg" style="text-align: center; font-size: 13px; color: var(--text-dim); margin-top: 15px;">
                    <i class="fa-solid fa-circle-info"></i> Room credentials will appear here 10-15 mins before start.
                </div>
            </div>
        </div>

        <div class="section-title"><i class="fa-solid fa-shield-halved"></i> JOINED WARRIORS</div>
        <div id="playerList">
            <div style="text-align: center; color: var(--text-dim); padding: 20px;">
                <i class="fa-solid fa-spinner fa-spin"></i> Checking Roster...
            </div>
        </div>
    </div>

    <div class="footer">
        <button class="copy-btn" id="copyBtn" onclick="copyDetails()" disabled>WAITING FOR ROOM INFO</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC5P3d9xk3XBrKTZw7aQFE2DhfOYsLsG_4",
            authDomain: "binary-battle-6917a.firebaseapp.com",
            projectId: "binary-battle-6917a",
            storageBucket: "binary-battle-6917a.firebasestorage.app",
            messagingSenderId: "411576208",
            appId: "1:411576208:web:1acb62c098fbdb550e7515"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const matchId = urlParams.get('matchId');

        let timer;

        if (matchId) {
            onSnapshot(doc(db, "tournaments", matchId), (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    
                    document.getElementById('gameName').innerText = data.title || data.game_name || "Tournament";
                    document.getElementById('matchDate').innerText = data.match_date || "TBA";
                    document.getElementById('matchType').innerText = (data.match_type || data.type || "SOLO").toUpperCase();
                    document.getElementById('prizePool').innerText = "₹" + (data.prize_pool || 0);
                    document.getElementById('matchStatus').innerText = data.status?.toUpperCase() || "SCHEDULED";

                    const credsBox = document.getElementById('credsBox');
                    const waitMsg = document.getElementById('waitMsg');
                    const copyBtn = document.getElementById('copyBtn');

                    if (data.room_id && data.password && data.room_id !== "" && data.password !== "") {
                        credsBox.style.display = 'block';
                        waitMsg.style.display = 'none';
                        document.getElementById('roomId').innerText = data.room_id;
                        document.getElementById('roomPass').innerText = data.password;
                        copyBtn.disabled = false;
                        copyBtn.innerText = "COPY ROOM INFO";
                    } else {
                        credsBox.style.display = 'none';
                        waitMsg.style.display = 'block';
                        copyBtn.disabled = true;
                        copyBtn.innerText = "WAITING FOR ROOM INFO";
                    }

                    if (timer) clearInterval(timer);
                    const target = new Date(`${data.match_date} ${data.match_time}`).getTime();

                    timer = setInterval(() => {
                        const now = new Date().getTime();
                        const diff = target - now;

                        if (diff < 0) {
                            clearInterval(timer);
                            document.getElementById("countdown").innerText = "STARTED";
                            document.getElementById("countdown").style.color = "var(--success)";
                            return;
                        }

                        const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                        const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                        const s = Math.floor((diff % (1000 * 60)) / 1000);

                        document.getElementById("countdown").innerText = 
                            `${h.toString().padStart(2,'0')}h ${m.toString().padStart(2,'0')}m ${s.toString().padStart(2,'0')}s`;
                    }, 1000);

                    // UPDATE: Load Players from the 'slots' object
                    const listContainer = document.getElementById('playerList');
                    const slots = data.slots || {};
                    const slotKeys = Object.keys(slots);

                    if (slotKeys.length === 0) {
                        listContainer.innerHTML = `<p style="text-align:center; color:var(--text-dim); font-size:14px; padding:20px;">The roster is currently empty.</p>`;
                    } else {
                        listContainer.innerHTML = '';
                        // Sort slots numerically
                        slotKeys.sort((a, b) => Number(a) - Number(b)).forEach(slotID => {
                            const playerObj = slots[slotID];
                            listContainer.innerHTML += `
                                <div class="player-card">
                                    <div style="display:flex; align-items:center; gap:12px;">
                                        <i class="fa-solid fa-user-ninja" style="color:var(--cyan)"></i>
                                        <span class="slot-num">#${slotID.toString().padStart(2, '0')}</span>
                                        <span class="p-name">${playerObj.playerName || 'Warrior'}</span>
                                    </div>
                                    <span class="p-status">READY</span>
                                </div>
                            `;
                        });
                    }
                } else {
                    document.body.innerHTML = `<div style="text-align:center; padding:100px; font-family:'Orbitron';">MATCH NOT FOUND</div>`;
                }
            });
        } else {
            window.location.href = "home.html";
        }

        window.copyDetails = () => {
            const id = document.getElementById('roomId').innerText;
            const pass = document.getElementById('roomPass').innerText;
            const text = `Binary Battle Room Info:\nRoom ID: ${id}\nPassword: ${pass}`;
            
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.getElementById('copyBtn');
                const originalText = btn.innerText;
                btn.innerText = "COPIED!";
                btn.style.background = "var(--success)";
                btn.style.color = "#000";
                
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.background = "linear-gradient(90deg, var(--accent), var(--cyan))";
                    btn.style.color = "#fff";
                }, 2000);
            });
        };
    </script>
</body>
</html>
