<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Secure Payment | Binary Battle</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05010a;
            --card-glass: rgba(25, 10, 50, 0.75);
            --accent: #8c00ff;
            --cyan: #00e5ff;
            --danger: #ff4d4d;
            --border: #2d1b4d;
            --text-dim: #a5a5a5;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rajdhani', sans-serif; }
        body { background: var(--bg); color: #fff; min-height: 100vh; overflow-x: hidden; }

        #loader { position: fixed; inset: 0; background: var(--bg); z-index: 6000; display: flex; align-items: center; justify-content: center; }

        .header {
            padding: 25px;
            background: linear-gradient(to bottom, rgba(140, 0, 255, 0.15), transparent);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .wallet-box {
            background: var(--card-glass);
            border: 1px solid var(--cyan);
            padding: 8px 16px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .balance-val { font-family: 'Orbitron'; color: #fff; font-size: 16px; }

        .container { padding: 20px; max-width: 500px; margin: 0 auto; }
        .checkout-card {
            background: var(--card-glass);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 35px 25px;
            text-align: center;
            backdrop-filter: blur(15px);
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
        }

        .entry-fee-label { text-transform: uppercase; letter-spacing: 2px; color: var(--cyan); font-size: 12px; font-weight: 700; }
        .entry-fee-amount { font-family: 'Orbitron'; font-size: 48px; margin: 15px 0; text-shadow: 0 0 20px var(--accent); }

        .input-group { margin-top: 30px; text-align: left; }
        .input-group label { display: block; margin-bottom: 10px; color: var(--text-dim); font-size: 13px; text-transform: uppercase; }
        .input-group input {
            width: 100%;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border);
            padding: 16px;
            border-radius: 14px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }
        .input-group input:focus { border-color: var(--cyan); }

        .join-btn {
            width: 100%;
            padding: 18px;
            border-radius: 16px;
            border: none;
            background: linear-gradient(90deg, var(--accent), #5a00a3);
            color: #fff;
            font-family: 'Orbitron';
            font-size: 18px;
            margin-top: 30px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 5px 15px rgba(140, 0, 255, 0.3);
        }

        #popup {
            position: fixed;
            top: -300px;
            left: 50%;
            transform: translateX(-50%);
            width: 88%;
            max-width: 360px;
            background: rgba(10, 5, 20, 0.98);
            border: 1px solid var(--danger);
            padding: 30px 20px;
            border-radius: 24px;
            z-index: 5000;
            transition: 0.6s;
            text-align: center;
            backdrop-filter: blur(10px);
        }
        #popup.show { top: 30px; }
        .popup-add-btn { display: block; margin-top: 15px; background: var(--danger); color: #fff; padding: 12px; border-radius: 10px; text-decoration: none; font-weight: bold; font-family: 'Orbitron'; font-size: 12px; }
    </style>
</head>
<body>

    <div id="loader"><i class="fa fa-circle-notch fa-spin" style="font-size: 30px; color: var(--cyan);"></i></div>

    <div id="popup">
        <div style="font-size: 40px; color: var(--danger); margin-bottom: 10px;"><i class="fa-solid fa-circle-exclamation"></i></div>
        <div style="font-family: 'Orbitron'; font-size: 18px;">Insufficient Balance</div>
        <p style="color: var(--text-dim); font-size: 14px; margin-top: 10px;">Please add funds to your wallet to join this match.</p>
        <a href="wallet.html" class="popup-add-btn">Add Money</a>
    </div>

    <header class="header">
        <a href="home.html" style="color: #fff; font-size: 20px;"><i class="fa-solid fa-chevron-left"></i></a>
        <div class="wallet-box">
            <i class="fa-solid fa-wallet" style="color: var(--cyan);"></i>
            <span class="balance-val">₹<span id="userBalance">0</span></span>
        </div>
    </header>

    <div class="container">
        <div class="checkout-card">
            <div class="entry-fee-label">Entry Fee</div>
            <div class="entry-fee-amount">₹<span id="matchEntryFee">0</span></div>
            
            <div class="input-group">
                <label>FreeFire In-Game Name</label>
                <input type="text" id="ffName" placeholder="Enter exact FF name...">
            </div>

            <button class="join-btn" id="confirmJoinBtn">Confirm & Pay</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc, increment, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC5P3d9xk3XBrKTZw7aQFE2DhfOYsLsG_4",
            authDomain: "binary-battle-6917a.firebaseapp.com",
            projectId: "binary-battle-6917a",
            storageBucket: "binary-battle-6917a.firebasestorage.app",
            messagingSenderId: "411576208",
            appId: "1:411576208:web:1acb62c098fbdb550e7515"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentBalance = 0;
        let entryFee = 0;
        let userEmail = "";

        const urlParams = new URLSearchParams(window.location.search);
        const matchId = urlParams.get('matchId');
        const selectedSlot = urlParams.get('slot');

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                userEmail = user.email; // Automatically capture user email
                if (!matchId || !selectedSlot) {
                    alert("Invalid Selection. Returning Home.");
                    window.location.href = "home.html";
                    return;
                }

                try {
                    const userSnap = await getDoc(doc(db, "users", user.uid));
                    if (userSnap.exists()) {
                        currentBalance = userSnap.data().wallet_balance || 0;
                        document.getElementById('userBalance').innerText = currentBalance;
                    }

                    const matchSnap = await getDoc(doc(db, "tournaments", matchId));
                    if (matchSnap.exists()) {
                        entryFee = Number(matchSnap.data().entry_fee || 0);
                        document.getElementById('matchEntryFee').innerText = entryFee;
                    }
                } catch (e) { console.error(e); }
                document.getElementById('loader').style.display = 'none';
            } else {
                window.location.href = "login.html";
            }
        });

        document.getElementById('confirmJoinBtn').addEventListener('click', async () => {
            const ffName = document.getElementById('ffName').value.trim();
            if (!ffName) return alert("Please enter your FF Name to continue!");

            if (currentBalance < entryFee) {
                document.getElementById('popup').classList.add('show');
                return;
            }

            const btn = document.getElementById('confirmJoinBtn');
            btn.disabled = true;
            btn.innerText = "PROCESSING...";
            document.getElementById('loader').style.display = 'flex';

            try {
                const userRef = doc(db, "users", auth.currentUser.uid);
                const matchRef = doc(db, "tournaments", matchId);

                // 1. DEDUCT BALANCE
                await updateDoc(userRef, { 
                    wallet_balance: increment(-entryFee) 
                });

                // 2. LOCK SLOT WITH PLAYER NAME AND EMAIL
                // This is where the email is saved so Admin can see it
                await updateDoc(matchRef, {
                    [`slots.${selectedSlot}`]: {
                        playerName: ffName,
                        userEmail: userEmail,
                        uid: auth.currentUser.uid,
                        timestamp: new Date().toISOString()
                    },
                    joined_players: increment(1)
                });

                // 3. REGISTER IN USER PROFILE
                await setDoc(doc(db, "users", auth.currentUser.uid, "joined_matches", matchId), {
                    slot: selectedSlot,
                    matchId: matchId,
                    joinedAt: new Date()
                });

                window.location.href = `banner.html?matchId=${matchId}&slot=${selectedSlot}`;

            } catch (e) {
                console.error("Locking Error:", e);
                alert("Payment error. Please try again.");
                btn.disabled = false;
                btn.innerText = "Confirm & Pay";
                document.getElementById('loader').style.display = 'none';
            }
        });
    </script>
</body>
</html>
