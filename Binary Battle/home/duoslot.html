<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Duo Slot Selection | Binary Battle</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #030014;
            --surface: rgba(12, 5, 28, 0.8);
            --accent: #8d2cff;
            --cyan: #00f2ff;
            --border: rgba(255, 255, 255, 0.1);
            --selected: #00ff88;
            --occupied: #ff2b56;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Orbitron', sans-serif; }
        
        body {
            min-height: 100vh;
            background: radial-gradient(circle at top right, #32105e 0%, transparent 40%), var(--bg);
            color: white;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 95%;
            max-width: 500px;
            padding: 25px 15px;
            border: 2px solid rgba(255, 255, 255, 0.08);
            background: rgba(7, 7, 35, 0.8);
            backdrop-filter: blur(10px);
            box-shadow: 0 0 40px rgba(132, 0, 255, 0.3);
            border-radius: 24px;
        }

        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { font-size: 24px; letter-spacing: 2px; color: #d7c6ff; text-shadow: 0 0 10px var(--accent); }
        .header p { font-size: 10px; color: var(--cyan); margin-top: 5px; opacity: 0.8; text-transform: uppercase; }

        /* DUO GRID: 2 Columns of Team Cards */
        .duo-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .team-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1.5px solid var(--border);
            border-radius: 14px;
            padding: 12px 10px;
            text-align: center;
            transition: 0.3s;
        }

        .team-label {
            font-size: 11px;
            color: var(--cyan);
            margin-bottom: 8px;
            opacity: 0.7;
        }

        .slots-pair {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        /* Slot Box Styling */
        .slot {
            width: 42px;
            height: 42px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
        }

        /* Selection States */
        .slot.selected {
            border-color: var(--selected);
            background: rgba(0, 255, 136, 0.15);
            box-shadow: 0 0 12px var(--selected);
            color: var(--selected);
        }

        .slot.occupied {
            opacity: 0.2;
            border-color: var(--occupied);
            background: rgba(255, 43, 86, 0.05);
            cursor: not-allowed;
            pointer-events: none;
        }

        .confirm-btn {
            width: 100%;
            height: 55px;
            margin-top: 20px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(90deg, var(--accent), var(--cyan));
            color: white;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(141, 44, 255, 0.3);
            transition: 0.3s;
            text-transform: uppercase;
        }

        .confirm-btn:disabled {
            filter: grayscale(1);
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>DUO ARENA</h1>
        <p>Choose 1 Position for your team</p>
    </div>

    <div class="duo-grid" id="duoGrid">
        </div>

    <button class="confirm-btn" id="confirmBtn" disabled>
        Confirm Duo Position | <span id="selectedDisplay">--</span>
    </button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC5P3d9xk3XBrKTZw7aQFE2DhfOYsLsG_4",
        authDomain: "binary-battle-6917a.firebaseapp.com",
        projectId: "binary-battle-6917a",
        storageBucket: "binary-battle-6917a.firebasestorage.app",
        messagingSenderId: "411576208",
        appId: "1:411576208:web:1acb62c098fbdb550e7515"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    const urlParams = new URLSearchParams(window.location.search);
    const matchId = urlParams.get('matchId');
    let selectedSlot = null;

    const duoGrid = document.getElementById('duoGrid');
    const confirmBtn = document.getElementById('confirmBtn');
    const selectedDisplay = document.getElementById('selectedDisplay');

    // Protect Page
    onAuthStateChanged(auth, (user) => {
        if (!user) window.location.href = "login.html";
    });

    function renderDuoGrid(bookedSlots = {}) {
        duoGrid.innerHTML = '';
        
        // 24 Teams = 48 Slots
        for (let t = 1; t <= 24; t++) {
            const teamCard = document.createElement('div');
            teamCard.className = 'team-card';
            
            let html = `<div class="team-label">TEAM ${t}</div><div class="slots-pair">`;
            
            for (let p = 1; p <= 2; p++) {
                const slotID = ((t - 1) * 2) + p;
                const isTaken = bookedSlots[slotID] ? true : false;
                
                html += `
                    <div class="slot ${isTaken ? 'occupied' : ''} ${selectedSlot == slotID ? 'selected' : ''}" 
                         onclick="${!isTaken ? `selectOne(${slotID})` : ''}">
                        ${slotID.toString().padStart(2, '0')}
                    </div>
                `;
            }
            
            html += `</div>`;
            teamCard.innerHTML = html;
            duoGrid.appendChild(teamCard);
        }
    }

    window.selectOne = (id) => {
        selectedSlot = id;
        selectedDisplay.innerText = id.toString().padStart(2, '0');
        confirmBtn.disabled = false;
        
        // Use document data to refresh UI highlight without multiple server calls
        const snapshot = duoGrid.querySelectorAll('.slot');
        snapshot.forEach(el => {
            if (!el.classList.contains('occupied')) {
                el.classList.remove('selected');
                if (el.innerText == id.toString().padStart(2, '0')) el.classList.add('selected');
            }
        });
    };

    confirmBtn.onclick = () => {
        if (selectedSlot && matchId) {
            window.location.href = `paymentbanner.html?matchId=${matchId}&slot=${selectedSlot}`;
        }
    };

    if (matchId) {
        onSnapshot(doc(db, "tournaments", matchId), (snap) => {
            if (snap.exists()) {
                renderDuoGrid(snap.data().slots || {});
            }
        });
    } else {
        window.location.href = "home.html";
    }
</script>

</body>
</html>
