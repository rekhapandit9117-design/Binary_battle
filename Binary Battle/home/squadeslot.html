<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Squad Slot Selection | Binary Battle</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #050019;
            --surface: rgba(7, 7, 35, 0.8);
            --accent: #8d2cff;
            --cyan: #14f1ff;
            --border: rgba(255, 255, 255, 0.1);
            --selected: #00ff88;
            --occupied: #ff2b56;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Orbitron', sans-serif; }
        
        body {
            min-height: 100vh;
            background: radial-gradient(circle at top left,#4b1f7d 0%,transparent 40%), #050019;
            color: white;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: rgba(7, 7, 35, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 20px 10px;
            border: 1px solid var(--border);
        }

        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { font-size: 22px; color: #fff; text-shadow: 0 0 10px var(--accent); letter-spacing: 1px; }
        .header p { font-size: 10px; color: var(--cyan); margin-top: 5px; text-transform: uppercase; opacity: 0.8; }

        .squad-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .team-row {
            background: rgba(255, 255, 255, 0.03);
            border: 1.5px solid var(--border);
            border-radius: 16px;
            padding: 12px;
            transition: 0.3s;
        }

        .team-label {
            font-size: 11px;
            font-weight: 800;
            color: var(--cyan);
            margin-bottom: 10px;
            text-align: center;
            opacity: 0.7;
        }

        /* 4 Slots per Team Row */
        .slots-group {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .slot {
            height: 45px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
        }

        /* Selected State */
        .slot.selected {
            border-color: var(--selected);
            background: rgba(0, 255, 136, 0.15);
            box-shadow: 0 0 12px var(--selected);
            color: var(--selected);
            transform: scale(1.05);
        }

        /* Occupied State */
        .slot.occupied {
            opacity: 0.2;
            border-color: var(--occupied);
            background: rgba(255, 43, 86, 0.05);
            cursor: not-allowed;
            pointer-events: none;
        }

        .confirm-btn {
            width: 100%;
            height: 55px;
            margin-top: 15px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(90deg, var(--accent), var(--cyan));
            color: white;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(141, 44, 255, 0.3);
            transition: 0.3s;
            text-transform: uppercase;
        }

        .confirm-btn:disabled {
            filter: grayscale(1);
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>SQUAD ARENA</h1>
        <p>Select your individual position</p>
    </div>

    <div class="squad-grid" id="squadGrid">
        </div>

    <button class="confirm-btn" id="confirmBtn" disabled onclick="handleConfirm()">
        Confirm Squad Position | <span id="slotLabel">--</span>
    </button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC5P3d9xk3XBrKTZw7aQFE2DhfOYsLsG_4",
        authDomain: "binary-battle-6917a.firebaseapp.com",
        projectId: "binary-battle-6917a",
        storageBucket: "binary-battle-6917a.firebasestorage.app",
        messagingSenderId: "411576208",
        appId: "1:411576208:web:1acb62c098fbdb550e7515"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    const urlParams = new URLSearchParams(window.location.search);
    const matchId = urlParams.get('matchId');
    let selectedSlot = null;

    const squadGrid = document.getElementById('squadGrid');
    const confirmBtn = document.getElementById('confirmBtn');
    const slotLabel = document.getElementById('slotLabel');

    // Auth Guard
    onAuthStateChanged(auth, (user) => {
        if (!user) window.location.href = "login.html";
    });

    function renderSquads(bookedSlots = {}) {
        squadGrid.innerHTML = '';

        // 12 Teams x 4 Players = 48 Slots
        for (let t = 1; t <= 12; t++) {
            const teamRow = document.createElement('div');
            teamRow.className = 'team-row';
            
            let slotsHTML = `<div class="team-label">TEAM ${t}</div><div class="slots-group">`;
            
            for (let p = 1; p <= 4; p++) {
                const slotID = ((t - 1) * 4) + p;
                const isOccupied = bookedSlots[slotID] ? true : false;
                
                slotsHTML += `
                    <div class="slot ${isOccupied ? 'occupied' : ''} ${selectedSlot == slotID ? 'selected' : ''}" 
                         onclick="${!isOccupied ? `selectSlot(${slotID})` : ''}">
                        ${slotID.toString().padStart(2, '0')}
                    </div>
                `;
            }
            
            slotsHTML += `</div>`;
            teamRow.innerHTML = slotsHTML;
            squadGrid.appendChild(teamRow);
        }
    }

    window.selectSlot = (id) => {
        selectedSlot = id;
        slotLabel.innerText = id.toString().padStart(2, '0');
        confirmBtn.disabled = false;
        
        // UI Highlight Update
        const allSlots = squadGrid.querySelectorAll('.slot');
        allSlots.forEach(el => {
            if (!el.classList.contains('occupied')) {
                el.classList.remove('selected');
                if (el.innerText == id.toString().padStart(2, '0')) el.classList.add('selected');
            }
        });
    };

    window.handleConfirm = () => {
        if (selectedSlot && matchId) {
            // Redirect to payment banner without writing to DB yet
            window.location.href = `paymentbanner.html?matchId=${matchId}&slot=${selectedSlot}`;
        }
    };

    if (matchId) {
        onSnapshot(doc(db, "tournaments", matchId), (snap) => {
            if (snap.exists()) {
                renderSquads(snap.data().slots || {});
            }
        });
    } else {
        window.location.href = "home.html";
    }
</script>

</body>
</html>
