<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Elite Intel | Binary Battle</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #030005;
            --card-bg: rgba(20, 10, 40, 0.4);
            --accent: #8c00ff;
            --neon: #00f2ff;
            --text-main: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.5);
            --border: rgba(140, 0, 255, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(140, 0, 255, 0.08), transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(0, 242, 255, 0.05), transparent 40%);
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
        }

        /* Top Navigation */
        .nav-header {
            padding: 30px 20px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .back-circle {
            width: 45px; height: 45px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: #fff; cursor: pointer;
        }

        .tournament-title {
            font-family: 'Orbitron'; font-size: 22px; font-weight: 800;
            letter-spacing: 1px; text-transform: uppercase;
            background: linear-gradient(to right, #fff, var(--neon));
            background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .main-container { padding: 0 20px 40px; max-width: 500px; margin: 0 auto; }

        /* Premium Live Vault */
        .live-vault {
            display: none; /* Hidden until 10 mins before match */
            background: linear-gradient(145deg, rgba(0, 242, 255, 0.1), rgba(140, 0, 255, 0.05));
            border: 1px solid var(--neon); border-radius: 24px;
            padding: 25px; margin-bottom: 30px; position: relative;
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.1);
        }

        .vault-header {
            font-family: 'Orbitron'; font-size: 10px; color: var(--neon);
            letter-spacing: 3px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px;
        }

        .cred-box { margin-bottom: 15px; }
        .cred-label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; margin-bottom: 5px; display: block; }
        .cred-value {
            font-family: 'Orbitron'; font-size: 20px; font-weight: 700;
            background: rgba(0,0,0,0.3); padding: 12px 15px; border-radius: 12px;
            border-left: 3px solid var(--neon); color: #fff;
            display: flex; justify-content: space-between; align-items: center;
        }

        /* Info Grid */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 25px; }
        .stat-card {
            background: var(--card-bg); border: 1px solid var(--border);
            padding: 18px 10px; border-radius: 18px; text-align: center;
        }
        .stat-card i { color: var(--accent); margin-bottom: 8px; font-size: 18px; }
        .stat-card span { display: block; font-size: 10px; color: var(--text-dim); text-transform: uppercase; }
        .stat-card b { display: block; font-size: 14px; font-family: 'Orbitron'; margin-top: 5px; }

        /* Data List */
        .data-card {
            background: var(--card-bg); border-radius: 24px;
            border: 1px solid var(--border); padding: 25px;
        }
        .data-row {
            display: flex; justify-content: space-between; padding: 15px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .data-row:last-child { border: none; }
        .d-label { color: var(--text-dim); font-size: 14px; }
        .d-value { font-weight: 700; color: #fff; }

        /* Loader */
        #loading-screen {
            position: fixed; inset: 0; background: var(--bg);
            z-index: 2000; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
        }
        .pulse-loader {
            width: 50px; height: 50px; border: 2px solid var(--neon);
            border-radius: 50%; animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 0.5; box-shadow: 0 0 0 0 rgba(0, 242, 255, 0.7); }
            70% { transform: scale(1); opacity: 1; box-shadow: 0 0 0 20px rgba(0, 242, 255, 0); }
            100% { transform: scale(0.8); opacity: 0.5; }
        }
    </style>
</head>
<body>

<div id="loading-screen">
    <div class="pulse-loader"></div>
    <p style="font-family: 'Orbitron'; margin-top: 20px; font-size: 10px; letter-spacing: 5px; color: var(--neon);">SECURE LINKING...</p>
</div>

<div id="content" style="display: none;">
    <div class="nav-header">
        <div class="back-circle" onclick="window.history.back()">
            <i class="fa-solid fa-chevron-left"></i>
        </div>
        <h1 class="tournament-title" id="tName">TOURNAMENT</h1>
    </div>

    <div class="main-container">
        <!-- The Live Vault (Logic controlled) -->
        <div id="liveVault" class="live-vault">
            <div class="vault-header">
                <i class="fa-solid fa-circle-dot fa-beat" style="color: var(--neon);"></i> SIGNAL DETECTED: LIVE
            </div>
            <div class="cred-box">
                <span class="cred-label">Room ID</span>
                <div class="cred-value"><span id="roomID">---</span> <i class="fa-solid fa-fingerprint" style="font-size: 14px; opacity: 0.4;"></i></div>
            </div>
            <div class="cred-box">
                <span class="cred-label">Password</span>
                <div class="cred-value"><span id="roomPass">---</span> <i class="fa-solid fa-shield-halved" style="font-size: 14px; opacity: 0.4;"></i></div>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <i class="fa-solid fa-award"></i>
                <span>Prize</span>
                <b id="tPrize">₹0</b>
            </div>
            <div class="stat-card">
                <i class="fa-solid fa-bolt"></i>
                <span>Entry</span>
                <b id="tEntry">FREE</b>
            </div>
            <div class="stat-card">
                <i class="fa-solid fa-users"></i>
                <span>Mode</span>
                <b id="tType">SOLO</b>
            </div>
        </div>

        <div class="data-card">
            <div class="data-row">
                <span class="d-label">Map</span>
                <span class="d-value" id="tMap">BERMUDA</span>
            </div>
            <div class="data-row">
                <span class="d-label">Match Date</span>
                <span class="d-value" id="tDate">--/--/--</span>
            </div>
            <div class="data-row">
                <span class="d-label">Match Time</span>
                <span class="d-value" id="tTime">00:00</span>
            </div>
            <div class="data-row">
                <span class="d-label">Status</span>
                <span class="d-value" style="color: var(--neon);">VERIFIED</span>
            </div>
        </div>

        <p style="text-align: center; color: var(--text-dim); font-size: 12px; margin-top: 30px; letter-spacing: 1px;">
            Credentials automatically decrypt 10 minutes before the match start time.
        </p>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC5P3d9xk3XBrKTZw7aQFE2DhfOYsLsG_4",
        authDomain: "binary-battle-6917a.firebaseapp.com",
        projectId: "binary-battle-6917a",
        storageBucket: "binary-battle-6917a.firebasestorage.app",
        messagingSenderId: "411576208",
        appId: "1:411576208:web:1acb62c098fbdb550e7515"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const tournamentId = new URLSearchParams(window.location.search).get('id');

    async function fetchTournamentIntel() {
        if (!tournamentId) return;

        try {
            const docSnap = await getDoc(doc(db, "tournaments", tournamentId));

            if (docSnap.exists()) {
                const data = docSnap.data();
                
                // Update Static Info
                document.getElementById('tName').innerText = data.game_name || "TOURNAMENT";
                document.getElementById('tPrize').innerText = `₹${data.prize_pool}`;
                document.getElementById('tEntry').innerText = data.entry_fee == 0 ? "FREE" : `₹${data.entry_fee}`;
                document.getElementById('tType').innerText = data.match_type || "SOLO";
                document.getElementById('tMap').innerText = data.map_name || "BERMUDA";
                document.getElementById('tDate').innerText = data.match_date;
                document.getElementById('tTime').innerText = data.match_time;

                // Live Access Logic
                const matchDate = data.match_date; // Expected: YYYY-MM-DD
                const matchTime = data.match_time; // Expected: HH:mm (24h)
                
                const matchDateTime = new Date(`${matchDate}T${matchTime}:00`);
                const now = new Date();
                
                // Diff in minutes
                const diff = (matchDateTime - now) / (1000 * 60);

                // If match is within 10 minutes OR already started
                if (diff <= 10) {
                    if (data.room_id && data.room_pass) {
                        document.getElementById('liveVault').style.display = 'block';
                        document.getElementById('roomID').innerText = data.room_id;
                        document.getElementById('roomPass').innerText = data.room_pass;
                    }
                }

                // Reveal
                document.getElementById('loading-screen').style.display = 'none';
                document.getElementById('content').style.display = 'block';
            }
        } catch (e) { console.error("Intel Error:", e); }
    }

    fetchTournamentIntel();
</script>

</body>
</html>
