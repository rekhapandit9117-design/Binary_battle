<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Binary Battle | Login</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #8c00ff;
            --secondary: #6a00ff;
            --bg-dark: #05010a;
            --card-bg: rgba(18, 8, 30, 0.95);
            --input-bg: #12081f;
            --border: #2d1b4d;
            --text-muted: #a5a5a5;
            --glow: rgba(140, 0, 255, 0.4);
            --danger: #ff2b56;
            --cyan: #00e5ff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rajdhani', sans-serif; }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; 
            background: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(140, 0, 255, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(106, 17, 203, 0.12) 0%, transparent 40%);
            color: #fff;
            padding: 20px;
            overflow-x: hidden;
        }

        /* --- PREMIUM POPUP SYSTEM --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 0, 10, 0.9); display: none; align-items: center;
            justify-content: center; z-index: 5000; backdrop-filter: blur(12px);
        }

        .custom-popup {
            width: 88%; max-width: 340px; 
            background: linear-gradient(145deg, #160a2d, #05010a);
            border-radius: 30px; text-align: center; overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: 0 25px 60px rgba(0,0,0,0.9);
            animation: premiumPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes premiumPop {
            from { transform: scale(0.6) translateY(50px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }

        .popup-content { padding: 35px 25px; }
        
        .popup-icon-wrapper {
            width: 65px; height: 65px; margin: 0 auto 15px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%; background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .popup-icon { font-size: 28px; }
        
        .popup-title { 
            font-family: 'Orbitron'; font-size: 16px; font-weight: 700; 
            margin-bottom: 10px; color: #fff; letter-spacing: 1px;
            text-transform: uppercase;
        }

        .popup-text { font-size: 14px; color: var(--text-muted); line-height: 1.5; margin-bottom: 5px; }

        .popup-input {
            width: 100%; background: #000; border: 1px solid var(--border);
            border-radius: 12px; padding: 12px; color: var(--cyan);
            text-align: center; font-family: 'Orbitron'; font-size: 20px;
            letter-spacing: 5px; margin: 15px 0; outline: none;
        }

        .popup-btn {
            width: 100%; padding: 18px; background: rgba(255,255,255,0.02);
            border: none; border-top: 1px solid var(--border);
            color: var(--primary); font-family: 'Orbitron'; font-weight: 700; font-size: 14px;
            cursor: pointer; text-transform: uppercase; letter-spacing: 2px;
        }

        /* --- LOGIN UI --- */
        .logo-section { width: 100%; max-width: 400px; margin-bottom: 20px; text-align: center; }
        .logo-text {
            font-family: 'Orbitron', sans-serif; font-size: clamp(28px, 8vw, 42px);
            font-style: italic; line-height: 1;
            background: linear-gradient(to bottom, #ffffff 30%, var(--primary) 100%);
            background-clip: text; -webkit-background-clip: text;
            -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 10px var(--glow));
        }

        .card {
            width: 100%; max-width: 400px; background: var(--card-bg);
            padding: clamp(25px, 8vw, 45px) clamp(20px, 6vw, 35px);
            border-radius: 24px; border: 1px solid var(--border);
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px); animation: slideUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(50px); } to { opacity: 1; transform: translateY(0); } }

        .icon-box {
            width: 60px; height: 60px; background: rgba(140, 0, 255, 0.05);
            border: 2px solid var(--primary); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 15px; font-size: 24px; color: var(--primary);
            box-shadow: 0 0 20px var(--glow);
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }

        .input-group { position: relative; margin-bottom: 18px; }
        .input-group i { position: absolute; top: 50%; transform: translateY(-50%); color: #666; }
        .input-group i:first-child { left: 18px; }
        .view-toggle { right: 18px; cursor: pointer; }

        .input-group input {
            width: 100%; padding: 15px 48px; background: var(--input-bg);
            border: 1px solid var(--border); border-radius: 12px; color: #fff;
            font-size: 16px; outline: none; transition: 0.3s;
        }

        .btn-main {
            width: 100%; padding: 16px; border: none; border-radius: 12px;
            background: linear-gradient(90deg, var(--secondary), var(--primary));
            color: #fff; font-weight: 700; font-size: 16px; letter-spacing: 2px;
            text-transform: uppercase; cursor: pointer; transition: 0.3s;
            margin-top: 10px;
        }

        .btn-main:disabled { opacity: 0.6; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="modal-overlay" id="modalOverlay">
        <div class="custom-popup">
            <div class="popup-content" id="popupContent">
                <div class="popup-icon-wrapper">
                    <i id="popupIcon" class="fa-solid fa-circle-info popup-icon"></i>
                </div>
                <h3 id="popupTitle" class="popup-title">System Alert</h3>
                <p id="popupText" class="popup-text">Details will be shown here.</p>
            </div>
            <button class="popup-btn" id="popupCloseBtn">Acknowledge</button>
        </div>
    </div>

    <div class="logo-section">
        <h1 class="logo-text">BINARY<br>BATTLE</h1>
    </div>

    <div class="card">
        <div class="card-header" style="text-align: center; margin-bottom: 30px;">
            <div class="icon-box" id="lockIconBox"><i class="fa fa-lock"></i></div>
            <h2 style="font-family: Orbitron; letter-spacing: 3px; text-transform: uppercase;">Login</h2>
            <div style="width: 40px; height: 3px; background: var(--primary); margin: 8px auto 0; border-radius: 2px;"></div>
        </div>

        <div class="input-group">
            <i class="fa fa-envelope"></i>
            <input type="email" id="logEmail" placeholder="Email Address">
        </div>

        <div class="input-group">
            <i class="fa fa-shield-halved"></i>
            <input type="password" id="logPass" placeholder="Password">
            <i class="fa fa-eye view-toggle" id="togglePassword"></i>
        </div>

        <a href="forget.html" style="display: block; text-align: right; font-size: 13px; color: var(--primary); text-decoration: none; margin: -10px 0 25px; font-weight: 700;">Forgot Password?</a>

        <button class="btn-main" id="loginBtn">Login</button>

        <p style="text-align: center; margin-top: 25px; font-size: 14px; color: var(--text-muted);">Need an account? <a href="register.html" style="color: var(--primary); text-decoration: none; font-weight: 700;">Register</a></p>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC5P3d9xk3XBrKTZw7aQFE2DhfOYsLsG_4",
        authDomain: "binary-battle-6917a.firebaseapp.com",
        projectId: "binary-battle-6917a",
        storageBucket: "binary-battle-6917a.firebasestorage.app",
        messagingSenderId: "411576208",
        appId: "1:411576208:web:1acb62c098fbdb550e7515"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let lockClickCount = 0;

    const showPopup = (type, customMsg) => {
        const overlay = document.getElementById('modalOverlay');
        const icon = document.getElementById('popupIcon');
        const title = document.getElementById('popupTitle');
        const text = document.getElementById('popupText');
        const btn = document.getElementById('popupCloseBtn');
        const content = document.getElementById('popupContent');

        const oldInput = document.getElementById('adminInput');
        if(oldInput) oldInput.remove();

        overlay.style.display = 'flex';

        if (type === 'error') {
            icon.className = "fa-solid fa-circle-xmark popup-icon";
            icon.style.color = "var(--danger)";
            title.innerText = "Error Occurred";
            title.style.color = "var(--danger)";
            btn.innerText = "Retry";
        } else if (type === 'admin') {
            icon.className = "fa-solid fa-user-shield popup-icon";
            icon.style.color = "var(--primary)";
            title.innerText = "Root Access";
            title.style.color = "var(--primary)";
            btn.innerText = "Verify Access";
            
            const input = document.createElement('input');
            input.type = "password";
            input.id = "adminInput";
            input.className = "popup-input";
            input.placeholder = "••••";
            input.maxLength = 4;
            content.appendChild(input);
            input.focus();
        } else {
            icon.className = "fa-solid fa-circle-info popup-icon";
            icon.style.color = "var(--cyan)";
            title.innerText = "Notice";
            title.style.color = "var(--cyan)";
            btn.innerText = "OK";
        }
        text.innerText = customMsg;
    };

    document.getElementById('popupCloseBtn').addEventListener('click', () => {
        const adminInp = document.getElementById('adminInput');
        if (adminInp) {
            if (adminInp.value === "8750") {
                window.location.href = "admin/adminhome.html";
            } else {
                showPopup('error', "The entered security code is invalid.");
            }
        } else {
            document.getElementById('modalOverlay').style.display = 'none';
        }
    });

    document.getElementById('lockIconBox').addEventListener('click', () => {
        lockClickCount++;
        if (lockClickCount === 4) {
            lockClickCount = 0; // Reset counter after invocation
            showPopup('admin', "Enter the 4-digit administrator security override.");
        }
    });

    document.getElementById('togglePassword').addEventListener('click', function() {
        const passInput = document.getElementById('logPass');
        if (passInput.type === "password") {
            passInput.type = "text";
            this.classList.replace("fa-eye", "fa-eye-slash");
        } else {
            passInput.type = "password";
            this.classList.replace("fa-eye-slash", "fa-eye");
        }
    });

    document.getElementById("loginBtn").addEventListener("click", async () => {
        const email = document.getElementById("logEmail").value.trim();
        const password = document.getElementById("logPass").value.trim();
        const btn = document.getElementById("loginBtn");

        if (!email || !password) {
            showPopup('error', "Email and password fields are required.");
            return;
        }

        btn.disabled = true;
        btn.innerText = "PROCESSING...";

        try {
            // First authenticate the session using standard Firebase Auth
            const userCredential = await signInWithEmailAndPassword(auth, email, password);
            const user = userCredential.user;

            // Double check validation within your users collection document layout
            const usersRef = collection(db, "users");
            const q = query(usersRef, where("email", "==", email), where("password", "==", password));
            const querySnapshot = await getDocs(q);

            if (!querySnapshot.empty) {
                // Request standard browser notification permission if not already granted
                if ("Notification" in window && Notification.permission !== "granted") {
                    await Notification.requestPermission();
                }

                // Explicitly found matching data row parameters
                localStorage.setItem("userEmail", email);
                localStorage.setItem("userUid", user.uid);
                window.location.href = "home/home.html";
            } else {
                // If Auth succeeds but custom row values don't align perfectly
                showPopup('error', "Your database account records could not be synchronized.");
                btn.disabled = false;
                btn.innerText = "LOGIN";
            }
        } catch (error) {
            btn.disabled = false;
            btn.innerText = "LOGIN";
            showPopup('error', "Authentication failed. Please verify your credentials.");
        }
    });
</script>
</body>
</html>
