<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Binary Battle | Premium Register</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #8c00ff;
            --secondary: #6a00ff;
            --bg-dark: #05010a;
            --card-bg: rgba(18, 8, 30, 0.95);
            --input-bg: #12081f;
            --border: #2d1b4d;
            --text-muted: #a5a5a5;
            --glow: rgba(140, 0, 255, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rajdhani', sans-serif; }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(140, 0, 255, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(106, 17, 203, 0.12) 0%, transparent 40%);
            color: #fff;
            padding: 20px;
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); display: none; align-items: center;
            justify-content: center; z-index: 1000; backdrop-filter: blur(4px);
        }

        .custom-popup {
            width: 90%; max-width: 320px; background: #1a1625;
            border-radius: 18px; text-align: center; overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            animation: popIn 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .popup-content { padding: 25px 20px; }
        .popup-icon { font-size: 30px; color: #a5a5a5; margin-bottom: 10px; display: block; }
        .popup-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; color: #fff; }
        .popup-text { font-size: 14px; color: #b0b0b0; line-height: 1.4; }
        
        .popup-btn {
            width: 100%; padding: 15px; background: transparent;
            border: none; border-top: 1px solid rgba(255,255,255,0.1);
            color: #8c00ff; font-weight: 700; font-size: 16px;
            cursor: pointer; text-transform: uppercase;
        }

        .logo-section { width: 100%; max-width: 400px; margin-bottom: 30px; text-align: center; }
        .logo-text {
            font-family: 'Orbitron', sans-serif; font-size: clamp(28px, 8vw, 42px);
            font-style: italic; line-height: 1;
            background: linear-gradient(to bottom, #ffffff 30%, var(--primary) 100%);
            background-clip: text; -webkit-background-clip: text;
            -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 10px var(--glow));
        }

        .card {
            width: 100%; max-width: 420px; background: var(--card-bg);
            padding: clamp(25px, 8vw, 40px) clamp(20px, 6vw, 35px);
            border-radius: 24px; border: 1px solid var(--border);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8); backdrop-filter: blur(12px);
        }

        .card-header { text-align: center; margin-bottom: 25px; }
        .icon-box {
            width: 65px; height: 65px; background: rgba(140, 0, 255, 0.05);
            border: 2px solid var(--primary); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 15px; font-size: 24px; color: var(--primary);
            box-shadow: 0 0 20px var(--glow);
        }

        .input-group { position: relative; margin-bottom: 15px; }
        .input-group i { position: absolute; top: 50%; transform: translateY(-50%); color: #666; }
        .input-group i:first-child { left: 18px; }
        .view-toggle { right: 18px; cursor: pointer; }

        .input-group input {
            width: 100%; padding: 14px 48px; background: var(--input-bg);
            border: 1px solid var(--border); border-radius: 12px;
            color: #fff; font-size: 16px; outline: none;
        }

        .btn-main {
            width: 100%; padding: 16px; border: none; border-radius: 12px;
            background: linear-gradient(90deg, var(--secondary), var(--primary));
            color: #fff; font-weight: 700; font-size: 16px; letter-spacing: 2px;
            text-transform: uppercase; cursor: pointer; margin-top: 10px;
        }

        .footer-links { text-align: center; margin-top: 20px; font-size: 14px; color: var(--text-muted); }
        .footer-links a { color: var(--primary); text-decoration: none; font-weight: 700; }
    </style>
</head>
<body>

    <div class="modal-overlay" id="modalOverlay">
        <div class="custom-popup">
            <div class="popup-content">
                <i id="popupIcon" class="fa fa-wifi popup-icon"></i>
                <h3 id="popupTitle" class="popup-title">Title</h3>
                <p id="popupText" class="popup-text">Message goes here.</p>
            </div>
            <button class="popup-btn" onclick="closePopup()">OK</button>
        </div>
    </div>

    <div class="logo-section">
        <h1 class="logo-text">BINARY<br>BATTLE</h1>
    </div>

    <div class="card">
        <div class="card-header">
            <div class="icon-box"><i class="fa fa-user-plus"></i></div>
            <h2 style="font-family: Orbitron; letter-spacing: 2px;">REGISTER</h2>
        </div>

        <form id="regForm">
            <div class="input-group">
                <i class="fa fa-user"></i>
                <input type="text" id="fullname" placeholder="Full Name" required>
            </div>
            
            <div class="input-group">
                <i class="fa fa-envelope"></i>
                <input type="email" id="email" placeholder="Email Address" required>
            </div>

            <div class="input-group">
                <i class="fa fa-lock"></i>
                <input type="password" id="pass1" placeholder="Create Password" required>
                <i class="fa fa-eye view-toggle" onclick="togglePass('pass1', this)"></i>
            </div>

            <div class="input-group">
                <i class="fa fa-tag"></i>
                <input type="text" id="promo" placeholder="Promo Code (Optional)">
            </div>

            <button type="submit" class="btn-main" id="regBtn">Create Account</button>
        </form>

        <div class="footer-links">
            Already a member? <a href="login.html">Login</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, setDoc, updateDoc, increment, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC5P3d9xk3XBrKTZw7aQFE2DhfOYsLsG_4",
            authDomain: "binary-battle-6917a.firebaseapp.com",
            projectId: "binary-battle-6917a",
            storageBucket: "binary-battle-6917a.firebasestorage.app",
            messagingSenderId: "411576208",
            appId: "1:411576208:web:1acb62c098fbdb550e7515",
            measurementId: "G-QHKKXN93P6"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.showPopup = function(type) {
            const overlay = document.getElementById('modalOverlay');
            const icon = document.getElementById('popupIcon');
            const title = document.getElementById('popupTitle');
            const text = document.getElementById('popupText');

            if (type === 'email') {
                icon.style.display = 'none'; 
                title.innerText = "Email Already Exists";
                text.innerText = "An account with this email already exists.";
            } else if (type === 'network') {
                icon.style.display = 'block';
                icon.className = "fa fa-wifi popup-icon";
                title.innerText = "No Internet";
                text.innerText = "Please check your connection.";
            } else if (type === 'weak-password') {
                icon.style.display = 'none'; 
                title.innerText = "Weak Password";
                text.innerText = "Password must be at least 6 characters.";
            }
            overlay.style.display = 'flex';
        };

        window.closePopup = function() {
            document.getElementById('modalOverlay').style.display = 'none';
        };

        window.togglePass = function(id, icon) {
            const input = document.getElementById(id);
            if (input.type === "password") {
                input.type = "text";
                icon.classList.replace("fa-eye", "fa-eye-slash");
            } else {
                input.type = "password";
                icon.classList.replace("fa-eye-slash", "fa-eye");
            }
        };

        document.getElementById('regForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('regBtn');
            const email = document.getElementById('email').value;
            const password = document.getElementById('pass1').value;
            const fullname = document.getElementById('fullname').value;
            const promo = document.getElementById('promo').value.trim().toUpperCase();

            btn.disabled = true;
            btn.innerText = "PROCESSING...";

            if (password.length < 6) {
                showPopup('weak-password');
                btn.disabled = false;
                btn.innerText = "CREATE ACCOUNT";
                return;
            }

            try {
                // 1. Create the user in Auth
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // 2. Generate a unique referral code for this new user
                const myReferralCode = (fullname.substring(0, 4) + Math.floor(1000 + Math.random() * 9000)).toUpperCase();

                // 3. Check and Reward the Referrer (if promo code exists)
                if (promo !== "") {
                    const q = query(collection(db, "users"), where("referralCode", "==", promo));
                    const querySnapshot = await getDocs(q);
                    
                    if (!querySnapshot.empty) {
                        querySnapshot.forEach(async (referrerDoc) => {
                            await updateDoc(doc(db, "users", referrerDoc.id), {
                                wallet_balance: increment(5)
                            });
                        });
                    }
                }

                // 4. Create the User Document (Now saving the password field)
                await setDoc(doc(db, "users", user.uid), {
                    uid: user.uid,
                    fullName: fullname, 
                    email: email,
                    password: password, // Saved directly to the user's document row
                    referralCode: myReferralCode, 
                    usedPromo: promo || "None", 
                    wallet_balance: 0,
                    total_earnings: 0,
                    matches_played: 0,
                    joinedAt: new Date().toISOString()
                });

                window.location.href = "home/home.html";

            } catch (error) {
                btn.disabled = false;
                btn.innerText = "CREATE ACCOUNT";
                if (error.code === 'auth/email-already-in-use') showPopup('email');
                else if (error.code === 'auth/network-request-failed') showPopup('network');
                else alert("ERROR: " + error.message);
            }
        });
    </script>
</body>
</html>
